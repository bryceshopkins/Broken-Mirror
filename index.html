<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror Run</title>
<style>
  html, body { margin: 0; height: 100%; background: #120d14; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ---------- Setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const INK = '#0b0a0f';
const GRAVITY = 2600, JUMP_V = 920;
const groundY = () => H * 0.72;

// ---------- Input ----------
const keys = {};
let jumpPressed = false, punchPressed = false;
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  // Escape freezes the run and opens the inventory; while it's open, nothing else reaches the game
  if (k === 'escape') { if (game.state === 'play') setPaused(!game.paused); return; }
  if (k === '=' && !keys[k]) { wallet += 1000; saveWallet(); }  // testing: +1000 gold (works in the shop too)
  if (game.paused) { keys[k] = true; return; }
  if ((k === 'w' || k === ' ') && !keys[k]) jumpPressed = true;
  if ((k === ' ' || k === 'enter') && game.state !== 'play') startGame();
  if (k === 'r') startGame();  // restart any time
  if (game.state === 'play' && !keys[k]) {
    // hotbars: 1 2 3 pick the left runner's slot, 4 5 6 the right runner's
    const n = '123456'.indexOf(k);
    if (n >= 0) selectSlot(laneFor(n < HOTBAR ? -1 : 1), n % HOTBAR);
    // Testing shortcuts
    if (k === '7') lanes.forEach(l => spawnObstacle(l, 'enemy'));
    if (k === '8') spawnObstacle(lanes[Math.random() < 0.5 ? 0 : 1], 'platform');
    if (k === '9') lanes.forEach(l => spawnObstacle(l, 'thrower'));
    if (k === '0' && !boss) startBoss();
    if (k === '-') lanes.forEach(l => { if (!l.body.inv.some(s => s && s.key === 'club') && addItem(l.body, 'club')) addLabel(l, 'club'); });
    if (k === 'b') lanes.forEach(l => spawnObstacle(l, 'brute'));
    if (k === 'x') lanes.forEach(l => { if (!l.body.inv.some(s => s && s.key === 'axe') && addItem(l.body, 'axe')) addLabel(l, 'axe'); });
    if (k === 'p' && !game.bossDefeated) {  // skip straight to the post-Gronk run (brutes start showing up)
      if (boss) { boss = null; lanes.forEach(l => { l.obs = l.obs.filter(o => o.type === 'coin' || o.type === 'item' || o.type === 'health'); }); }
      game.bossDefeated = true; nextBeat = 300; nextPlatform = 800;
      popups.push({ x: W / 2, y: 150, vx: 0, vy: -40, text: 'GRONK SKIPPED', word: true, side: -1, life: 1.4, age: 0 });
    }
  }
  keys[k] = true;
  if (k === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const mouse = { x: 0, y: 0, held: false };
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  // in the inventory, pressing on an item and moving a few px picks it up
  const d = menu.down;
  if (d && !menu.drag && laneFor(d.side).body.inv[d.i] && Math.hypot(mouse.x - d.x, mouse.y - d.y) > 5) menu.drag = d;
  canvas.style.cursor = game.paused ? (menu.drag ? 'grabbing' : menuSlotAt(mouse.x, mouse.y) || shopButtonAt(mouse.x, mouse.y) ? 'pointer' : 'default')
                      : game.state === 'play' && hotbarAt(mouse.x, mouse.y) ? 'pointer' : '';
});
canvas.addEventListener('mousedown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (game.paused) {
    const sb = shopButtonAt(mouse.x, mouse.y);
    if (sb) { buy(sb.row, sb.side); return; }
    const s = menuSlotAt(mouse.x, mouse.y);
    menu.down = s ? { ...s, x: mouse.x, y: mouse.y } : null;
    return;
  }
  if (game.state !== 'play') { startGame(); return; }
  // clicking a hotbar slot switches to it instead of attacking
  const hb = hotbarAt(mouse.x, mouse.y);
  if (hb) selectSlot(laneFor(hb.side), hb.i); else punchPressed = mouse.held = true;
});
window.addEventListener('mouseup', () => {
  mouse.held = false;
  const { down, drag } = menu;
  menu.down = menu.drag = null;
  if (!game.paused || !down) return;
  if (drag) {  // drop: only within the same runner's inventory
    const to = menuSlotAt(mouse.x, mouse.y);
    if (to && to.side === drag.side) moveStack(laneFor(drag.side).body, drag.i, to.i);
  } else if (down.i < HOTBAR) selectSlot(laneFor(down.side), down.i);  // a plain click on a hotbar slot holds it
});
function setPaused(on) {
  game.paused = on; menu.down = menu.drag = null; mouse.held = false;
  jumpPressed = punchPressed = false;
  canvas.style.cursor = on ? 'default' : '';
}

// ---------- Game state ----------
// Both characters share ONE body state; only the worlds they run through differ.
const game = { state: 'title', best: 0, paused: false };
const menu = { down: null, drag: null };  // inventory screen: the slot pressed on, and the one being dragged
let player, lanes, particles, popups, labels, impact, shake, distance, speed, nextBeat, nextPlatform, time;

// Tuning — kept slow for now while players learn the mirrored controls.
const BASE_SPEED = 200, MAX_SPEED = 420, SPEED_RAMP = 200;  // ramp: px travelled per +1 px/s
const ENEMY_HP = 12;

// Weapon stats. Every attack, fists included, has:
//   attackSpeed  a tier from ATTACK_SPEED: how many attacks per second that runner can make
//   min / max    damage per hit (rolled between the two)
//   critChance   0-1 chance a hit is a crit; critMult multiplies a crit's damage
//   range        how far in front of the runner a melee hit reaches (px)
//   swing        how long the attack animation lasts (s), and when in it the hit is live
//                (as fractions of that time)
const ATTACK_SPEED = { extreme: 16, fast: 5, medium: 3.3, slow: 1.4 };  // attacks per second
const ATTACK_BUFFER = 0.2;  // s a click is remembered while the weapon is still recovering
const PUNCH = { name: 'Fists', rarity: 'common', melee: true, anim: 'punch', attackSpeed: 'medium', min: 12, max: 16,
                critChance: 0.2, critMult: 2, range: 80, swing: { dur: 0.24, hit: [0.12, 0.88] },
                desc: 'Placeholder tooltip. (Used whenever the selected hotbar slot is empty.)' };

// Items. They belong to whichever runner picks them up, so the two sides can end up differently
// armed. Rarity sets the color of the item's name. `desc` is the tooltip flavor text in the inventory.
//   melee       swung when it's the selected hotbar item (`anim` picks the animation)
//   throwSpeed  thrown, one per attack, used up from the stack (`lob`: falls and bounces, like the grenade)
//   beam        sprays piercing laser bolts at the cursor; `auto` keeps firing while the mouse is held
//   aoe         explodes, hitting everything within this radius (you too, if you're close)
//   block       chance it turns aside an enemy attack while it's the item in hand
//   heal        HP restored when used from the hotbar (`cooldown`: seconds before that runner can use another)
//   stack       how many fit in one slot (default 1)
//   type        what the tooltip calls items that aren't weapons
const RARITY = { common: '#ffffff', uncommon: '#5bd16a', rare: '#4da6ff', epic: '#c77dff', legendary: '#ff9f1c' };
const ITEMS = {
  shuriken: { name: 'Shuriken', rarity: 'common', stack: 99, attackSpeed: 'fast', min: 12, max: 16, critChance: 0.2, critMult: 2,
              throwSpeed: 650, swing: { dur: 0.18, hit: [0, 0] },
              desc: 'Every 6th grader\'s wet dream, these stars were forged by hand by a master weapon smith (they were made in China and ordered on Amazon). These are consumable items.' },
  club: { name: 'Spiked Club', rarity: 'rare', melee: true, anim: 'club', attackSpeed: 'slow', min: 24, max: 32, critChance: 0.2, critMult: 2,
          range: 145, swing: { dur: 0.7, hit: [0.36, 1] },  // live from the downswing on, so spam-clicking covers you
          desc: 'Hey batter batter batter- the perfect tool for any major league baseball player, as long as that major league baseball player has a fetish for turning people into pancakes.' },
  axe: { name: 'Battle Axe', rarity: 'rare', melee: true, anim: 'club', attackSpeed: 'slow', min: 25, max: 25, critChance: 0.2, critMult: 2,
         range: 175, block: 0.1, swing: { dur: 0.7, hit: [0.36, 1] },
         desc: 'One swing from this can split you in two... again... I guess.' },
  // shop items
  grenade: { name: 'Grenade', rarity: 'uncommon', stack: 20, attackSpeed: 'slow', min: 50, max: 50, critChance: 0, critMult: 1,
             throwSpeed: 560, lob: true, aoe: 110, swing: { dur: 0.3, hit: [0, 0] },
             desc: 'This little bundle of joy has the ability to completely obliterate anybody that is unfortunate enough to be on the receiving end of the explosion, including the thrower themselves if they get too close. And you wonder why women live longer than men.' },
  bandage: { name: 'Bandage', rarity: 'common', type: 'Consumable', stack: 10, heal: 15, cooldown: 15,
             desc: 'Gives 15 healthpoints. 15 second cooldown. Increased effectiveness when paired with a kiss to your boo boo, but we don\'t sell those.' },
  obliterator: { name: 'The Obliterator', rarity: 'legendary', beam: true, auto: true, attackSpeed: 'extreme', min: 200, max: 200,
                 critChance: 0.1, critMult: 2, swing: { dur: 0.07, hit: [0, 0] },
                 desc: 'Don\'t bring a knife to a fucking space age superhuman weapon fight. Said to be fueled by pure hatred, this weapon could make even Americans reconsider the 2nd amendment.' },
  // Placeholders, so the inventory has something in it. Weapons swing with the punch animation for now.
  dagger: { name: 'Rusty Dagger', rarity: 'common', melee: true, anim: 'punch', attackSpeed: 'fast', min: 8, max: 11,
            critChance: 0.35, critMult: 2, range: 75, swing: { dur: 0.16, hit: [0.1, 0.9] }, desc: 'Placeholder tooltip.' },
  pan: { name: 'Frying Pan', rarity: 'uncommon', melee: true, anim: 'punch', attackSpeed: 'medium', min: 17, max: 22,
         critChance: 0.15, critMult: 2.5, range: 95, swing: { dur: 0.26, hit: [0.15, 0.85] }, desc: 'Placeholder tooltip.' },
  snack: { name: 'Mystery Snack', rarity: 'common', type: 'Consumable', stack: 20, desc: 'Placeholder tooltip. (Can\'t be used yet.)' },
  pebble: { name: 'Suspicious Pebble', rarity: 'epic', type: 'Trinket', desc: 'Placeholder tooltip.' },
};
const attackOf = r => ITEMS[r.attack] || PUNCH;
const swingK = r => r.swingT / attackOf(r).swing.dur;  // 0-1 through the current attack, >1 once it's over
const striking = r => { const h = attackOf(r).swing.hit, k = swingK(r); return attackOf(r).melee && k >= h[0] && k < h[1]; };

// Boss fights: after `after` seconds of running, every `checkEvery` seconds there's a `chance` one
// shows up. Beat it and it won't come back this run.
const BOSS = {
  after: 45, checkEvery: 2, chance: 0.3,
  name: 'GRONK', title: 'THE SPIKED CLUB', hp: 600,
  scale: 0.8,                                      // drawn size (1 = the original big brute)
  walkSpeed: 85, reach: 120,                       // how close he walks before swinging
  windup: 1.15, swing: 0.2, recover: 0.8,           // slow, telegraphed club swings (he's a beginner boss)
  swingNear: 20, swingFar: 175,                    // how far in front of him the club reaches
  // Each swing only covers one height band, built around where its target is standing when he
  // winds up (from a bit below their feet to a bit above their head). Get above or below it to dodge.
  band: { below: 15, above: 85 },
  shoulderH: 114, clubLen: 140,                    // used to aim the club head at the band
  crouch: 0.6, leapT: 0.8, leapH: 170, leapDist: 220,  // a short hop toward the other runner
  waveSpeed: 260, waveRange: 300, waveH: 26,       // slow shockwaves that die out; jump higher than waveH
  // Rage: he plants himself in the middle and roars, then lunges at one side and slams, hops back,
  // and does the same to the other side. Each slam gets its own warning, aimed at that runner.
  rage: { roar: 1.0, windup: 1.0, swing: 0.24, back: 0.4, recover: 1.0 },
};
let boss = null;
// Health: each runner has its own HP, and if either one hits 0 the run is over, so you have to look
// after both. Every hit goes through hurtRunner (the place to hook in armor later), with these amounts:
const MAX_HP = 100, INVULN_T = 1.2;  // s of invulnerability after a hit (each runner has its own)
// Healing beyond bandages: a slow regen that kicks in a while after the last hit, health orbs that
// enemies sometimes drop (only while that runner is hurt), and a few big ones from every boss.
const REGEN = { delay: 5, rate: 0.35 };  // s after a hit before it starts; HP per second
const HEALTH_DROP = { chance: 0.08, enemyHeal: 10, bossHeal: 25, bossCount: 2 };
const DAMAGE = { brute: 25, axe: 35, enemy: 20, star: 15, spike: 25, bar: 25, block: 15, ledge: 15, wave: 25, club: 35, rage: 45 };
const STAR = { y: 46, enemySpeed: 160, windup: 0.3, cooldown: 1.5 };  // thrown at chest height
const SHURIKEN_DROP_WEIGHTS = [25, 35, 25, 10, 5];  // index = how many a thrower drops (0-4)
// Brutes show up once Gronk is down: slow and thick, swinging a huge axe in an overhead arc that
// covers everything in front of them and above their head, so hopping over one gets you chopped.
// Slide under the swing. Every hit knocks them back about as far as the ground scrolls before
// your next attack, so you can keep laying into one instead of it walking through you.
const BRUTE = {
  chance: 0.25,                 // chance a beat is a brute beat (only one brute out at a time)
  hp: 90, walk: 10,             // walk: px/s toward you, on top of the scrolling ground
  reach: 140,                   // how far in front of him the axe reaches
  zone: { lo: 40, hi: 240 },    // the height band the swing covers, above his feet (a slide gets under it)
  windup: 0.6, swing: 0.16, recover: 0.45, cycle: 1.6,  // cycle: s from the start of one windup to the next
  endA: 0.35,                   // axe angle where the swing ends (0 = straight forward, negative = up)
  kbDecay: 8, kbExtra: 20,      // knockback eases out at this rate; kbExtra = px of ground gained per hit
  axeDrop: 0.1,
};
const BRUTE_PATTERNS = [[['brute'], []], [['brute'], ['enemy', 200]], [['brute'], ['thrower', 150]], [['brute'], ['block', 120]]];

// ---------- Inventory ----------
// Each runner has its own inventory: HOTBAR + BAG slots, each holding a stack { key, n } or nothing.
// The first HOTBAR slots are the hotbar; `slot` is the one in hand (an empty one means fists).
const HOTBAR = 3, BAG_COLS = 4, BAG = 12;
const RUNNER_NAMES = { '-1': 'Sunset Runner', '1': 'Twilight Runner' };
// Placeholder starting gear, so the inventory screen has something in it. It goes in the bag,
// so a run still starts empty-handed until you put something on the hotbar.
const START_BAG = { '-1': [['dagger'], ['snack', 3], ['pebble']], '1': [['pan'], ['snack', 2]] };
const laneFor = side => lanes[side < 0 ? 0 : 1];
const maxStack = key => ITEMS[key].stack || 1;
const heldKey = r => (r.inv[r.slot] ? r.inv[r.slot].key : null);
const hotkey = (side, i) => String(i + 1 + (side < 0 ? 0 : HOTBAR));

// Put n of an item into the inventory: topping up stacks of it first, then the slot in hand if
// it's empty (so grabbing a weapon empty-handed equips it), then the first free slot.
// Returns false (and adds nothing) if it doesn't all fit.
function addItem(r, key, n = 1) {
  const max = maxStack(key);
  let room = r.inv.reduce((a, s) => a + (s ? (s.key === key ? max - s.n : 0) : max), 0);
  if (room < n) return false;
  for (const s of r.inv) if (s && s.key === key && s.n < max) { const k = Math.min(n, max - s.n); s.n += k; n -= k; }
  const order = [r.slot, ...r.inv.keys()];
  for (const i of order) {
    if (n <= 0) break;
    if (!r.inv[i]) { const k = Math.min(n, max); r.inv[i] = { key, n: k }; n -= k; }
  }
  return true;
}
// Drag-and-drop: drop onto the same item to merge the stacks, otherwise the two slots swap.
function moveStack(r, a, b) {
  const A = r.inv[a], B = r.inv[b];
  if (a === b || !A) return;
  if (B && B.key === A.key && B.n < maxStack(A.key)) {
    const k = Math.min(A.n, maxStack(A.key) - B.n);
    B.n += k; A.n -= k;
    if (!A.n) r.inv[a] = null;
  } else { r.inv[a] = B; r.inv[b] = A; }
}
function selectSlot(lane, i) { lane.body.slot = i; lane.body.switchAt = time; }

function startGame() {
  player = { off: 120, coins: 0, phase: 0, tilt: 0 };
  // Inputs are shared, but each runner has its own body so they can stand on different planes,
  // and its own inventory so they can carry different weapons.
  const body = side => {
    const r = { hp: MAX_HP, hpLag: MAX_HP, hitAt: -99, invuln: 0, cds: {}, side, y: 0, vy: 0, grounded: true, sliding: false, dropT: 0, inv: Array(HOTBAR + BAG).fill(null), slot: 0, switchAt: -9,
                attack: 'punch', swingT: 99, punchAlt: false, aimA: Math.PI / 2, attackCd: 0, queued: 0, hits: new Set() };
    START_BAG[side].forEach(([key, n = 1], i) => { r.inv[HOTBAR + i] = { key, n }; });
    return r;
  };
  lanes = [{ side: -1, obs: [], hills: makeHills(), body: body(-1) },
           { side: 1, obs: [], hills: makeHills(), body: body(1) }];
  particles = []; popups = []; labels = []; impact = null;
  shake = 0; distance = 0; speed = BASE_SPEED; nextBeat = 400; nextPlatform = 1100; time = 0;
  boss = null; game.bossDefeated = false; game.bossCheck = BOSS.checkEvery; game.fadeIn = 0;
  game.state = 'play'; setPaused(false);
}

function makeHills() {
  const h = [];
  for (let i = 0; i < 8; i++) h.push({ x: i * 220 + Math.random() * 80, r: 90 + Math.random() * 120 });
  return h;
}

// ---------- Obstacle patterns ----------
// Each beat places obstacles on one or both lanes. Pairs are chosen so they're
// always solvable with one shared body (e.g. never a wall and a low block at the same spot).
// (Floating platforms aren't in here; they spawn on their own timer so they show up reliably.)
// Earlier entries are unlocked first; terrain (ledges, tunnels) is in from the start.
const PATTERNS = [
  [['enemy'], []], [['block'], []], [['ledge'], []], [['tunnel'], []], [['thrower'], []], [['enemy'], ['enemy']],
  [['spike'], []], [['thrower'], ['enemy', 150]], [['block'], ['spike']], [['thrower'], ['block']], [['ledge'], ['enemy', 200]], [['tunnel'], ['enemy', 220]],
  [['spike'], ['spike']], [['ledge'], ['ledge', 160]], [['tunnel'], ['ledge', 120]],
  [['block'], ['block']], [['bar'], []], [['bar'], ['bar']], [['enemy'], ['block']],
  [['spike'], ['bar', 260]],  // jump, then slide
  [['bar'], ['spike', 300]],  // slide, then jump
];
const PLATFORM = { len: 520, h: 110 };
const BLOCK = { half: 20, h: 42 };
const LEDGE = { minLen: 400, maxLen: 950, minH: 42, maxH: 78 };
// Tunnel: a jumpable hole in the floor, a roof you can keep running on, and stairs back up.
// Lengths are along the lane; depth is how far below the floor the tunnel bottom is.
const TUNNEL = { minLen: 520, maxLen: 860, depth: 120, gap: 120, roof: 12, stepW: 30, steps: 6 };
const STEP_H = TUNNEL.depth / TUNNEL.steps;
let wallet = 0;
try { wallet = Number(localStorage.getItem('mirrorrun.wallet')) || 0; } catch (e) {}
function saveWallet() { try { localStorage.setItem('mirrorrun.wallet', wallet); } catch (e) {} }

// Height of any raised ground (ledge) covering lane-distance d, so new things sit on top of it.
function ledgeLift(lane, d) {
  const l = lane.obs.find(o => o.type === 'ledge' && Math.abs(o.d - d) < o.len / 2);
  return l ? l.h : 0;
}

// Tunnel geometry, in "u" = distance past the tunnel's near edge.
const stairsStart = t => t.len - TUNNEL.steps * TUNNEL.stepW;
const roofEnd = t => t.len;  // the roof is a pass-through platform over the whole tunnel, stairs included
function tunnelAt(lane, d) {
  const t = lane.obs.find(o => o.type === 'tunnel' && d >= o.d - o.len / 2 && d <= o.d + o.len / 2);
  return t ? { t, u: d - (t.d - t.len / 2) } : null;
}
// Floor height at d (positive = below normal ground): tunnel bottom, the stairs, or 0.
// The stairs are drawn as steps but walked as a smooth ramp along their front corners,
// so climbing out is one continuous glide instead of a series of snaps.
function floorAt(lane, d) {
  const hit = tunnelAt(lane, d);
  if (!hit) return 0;
  const { t, u } = hit, s = stairsStart(t);
  if (u < s) return t.depth;
  return t.depth * (1 - (u - s) / (t.len - s));
}
const underRoof = (lane, d) => { const h = tunnelAt(lane, d); return h && h.u > h.t.gap && h.u < roofEnd(h.t); };

// The surface a walking enemy at height y should stand on at d: raised ground, the tunnel roof
// (if it's already up there), a tunnel floor or stair step, or plain ground.
function surfaceAt(lane, d, y, hopsHoles = false) {
  const lift = ledgeLift(lane, d);
  if (lift) return -lift;
  const hit = tunnelAt(lane, d);
  if (hit && y <= 0 && (hopsHoles || hit.u > hit.t.gap)) {
    // walking enemies up top hop across the hole instead of tumbling into it
    if (hit.u <= hit.t.gap) return -Math.sin(Math.PI * hit.u / hit.t.gap) * 45;
    return 0;  // on the roof
  }
  return floorAt(lane, d);
}
// Terrain never stacks, and never slides in under a floating platform (that's what used to
// leave platform guards hanging in the sky).
const terrainOverlaps = (lane, a, b) =>
  lane.obs.some(o => (o.type === 'ledge' || o.type === 'tunnel' || o.type === 'platform') &&
                     o.d + o.len / 2 > a && o.d - o.len / 2 < b);

// `extra` pushes the obstacle further out; `y` lifts it (negative = up). Unless `placed`,
// it's automatically raised onto any ledge underneath it, and skipped if it would float over a hole.
// Overhead walls and enemies don't share space: an enemy would stand inside the wall.
const nearBar = (lane, d, r) => lane.obs.some(o => o.type === 'bar' && Math.abs(o.d - d) < r);
const nearEnemy = (lane, d, r) => lane.obs.some(o => o.type === 'enemy' && !o.dead && Math.abs(o.d - d) < r);

function spawnObstacle(lane, type, extra = 0, y = 0, placed = false) {
  const d = W / 2 + 60 + extra;
  let kind = null;
  if (type === 'thrower' || type === 'brute') { kind = type; type = 'enemy'; }
  const isTerrain = type === 'ledge' || type === 'tunnel';
  let len = 0;
  if (isTerrain) {
    len = type === 'ledge' ? LEDGE.minLen + Math.random() * (LEDGE.maxLen - LEDGE.minLen)
                           : TUNNEL.minLen + Math.random() * (TUNNEL.maxLen - TUNNEL.minLen);
    if (terrainOverlaps(lane, d - 40, d + len + 40)) return null;  // never stack terrain
  } else if (!placed && type !== 'platform' && tunnelAt(lane, d) && !underRoof(lane, d)) {
    return null;  // would float over a hole
  }
  if (type === 'enemy' && nearBar(lane, d, 90)) return null;
  if (type === 'bar' && nearEnemy(lane, d, 120)) return null;
  const lift = placed || isTerrain ? 0 : ledgeLift(lane, d);
  const o = { type, d, y: y - lift, hit: false, dead: false, hp: ENEMY_HP, t: Math.random() * 6,
              walks: type === 'enemy' && !placed && (!kind || kind === 'brute') };
  if (kind === 'thrower') { o.kind = kind; o.throwCd = 0.05 + Math.random() * 0.25; o.windT = 0; o.relT = 0; }
  if (kind === 'brute') Object.assign(o, { kind, hp: BRUTE.hp, maxHp: BRUTE.hp, kb: 0, cd: 0.3, windT: 0, swingT: 0, recT: 0, flashT: 0 });
  if (type === 'tunnel') { o.depth = TUNNEL.depth; o.gap = TUNNEL.gap; }
  if (isTerrain) { o.len = len; o.d += len / 2; settleOnto(lane, o); }
  lane.obs.push(o);
  if (type === 'tunnel') {
    // the reward for dropping in: a coin trail along the bottom, and sometimes a guard waiting
    // right at the foot of the drop, so going down means fighting through him
    const guard = Math.random() < 0.4;
    for (let x = o.gap + (guard ? 110 : 30); x < stairsStart(o) - 20; x += 45) spawnObstacle(lane, 'coin', extra + x, o.depth - 28, true);
    if (guard) spawnObstacle(lane, 'enemy', extra + o.gap + 50, o.depth, true);
  }
  if (type === 'platform') {
    o.len = PLATFORM.len; o.h = PLATFORM.h + lift; o.y = 0; o.d += o.len / 2;
    // coins along the top reward going up; sometimes an enemy guards them
    for (let i = 0; i < 6; i++) spawnObstacle(lane, 'coin', extra + 60 + i * 70, -o.h - 34, true);
    if (Math.random() < 0.6) spawnObstacle(lane, 'enemy', extra + o.len - 90, -o.h, true);
  }
  if (type === 'ledge') {
    // the top of a ledge is just more floor: give it coins, enemies and hazards
    if (Math.random() < 0.6) for (let i = 0; i < 4; i++) spawnObstacle(lane, 'coin', extra + 80 + i * 40, -o.h - 28, true);
    if (Math.random() < 0.5) spawnObstacle(lane, 'enemy', extra + o.len * (0.45 + Math.random() * 0.4), -o.h, true);
    else if (Math.random() < 0.5) spawnObstacle(lane, 'spike', extra + o.len * 0.6, -o.h, true);
  }
  if (type === 'block' && Math.random() < 0.5) {  // a little arc of coins over the block
    [-1, 0, 1].forEach(i => spawnObstacle(lane, 'coin', extra + i * 38, o.y - BLOCK.h - 50 + Math.abs(i) * 22, true));
  }
  return o;
}
// New terrain can arrive under things that are already out there (an enemy or coins spawned
// further out). Raise them onto a ledge, and clear static ground clutter out of a tunnel's hole.
function settleOnto(lane, t) {
  if (t.type === 'ledge') t.h = Math.round(LEDGE.minH + Math.random() * (LEDGE.maxH - LEDGE.minH));
  const a = t.d - t.len / 2, b = t.d + t.len / 2;
  for (const o of lane.obs) {
    if (o.d < a || o.d > b) continue;
    if (t.type === 'ledge') {
      o.y -= t.h;
    } else if (o.type !== 'platform' && !o.walks && o.y <= 0 && o.y > -60) {  // ground clutter only
      const u = o.d - a;
      if (u <= t.gap || u >= roofEnd(t)) o.dead = true;
    }
  }
}

function spawnPlatform() {
  const i = Math.random() < 0.5 ? 0 : 1;
  spawnObstacle(lanes[i], 'platform');
  if (Math.random() < 0.5) spawnObstacle(lanes[1 - i], 'enemy', 250);  // keep the other side busy
}
function spawnBeat() {
  const bruteOut = lanes.some(l => l.obs.some(o => o.kind === 'brute' && !o.dead));
  const p = game.bossDefeated && !bruteOut && Math.random() < BRUTE.chance
    ? BRUTE_PATTERNS[Math.floor(Math.random() * BRUTE_PATTERNS.length)]
    : PATTERNS[Math.floor(Math.random() * Math.min(PATTERNS.length, 5 + distance / 2000))];
  const flip = Math.random() < 0.5;
  [p[0], p[1]].forEach((o, i) => { if (o.length) spawnObstacle(lanes[flip ? 1 - i : i], o[0], o[1]); });
  if (Math.random() < 0.35) {  // a loose line of ground coins between beats
    const lane = lanes[Math.random() < 0.5 ? 0 : 1];
    for (let i = 0; i < 5; i++) spawnObstacle(lane, 'coin', 300 + i * 40, -28);
  }
}

// Things a runner can stand on: platforms (one-way, can drop through), solid blocks and ledges.
const isSolid = o => o.type === 'block' || o.type === 'ledge';
function supportHalf(o) {
  if (o.type === 'platform') return o.len / 2;
  if (o.type === 'ledge') return o.len / 2 + 8;
  if (o.type === 'block') return BLOCK.half + 8;
  return -1;
}
// height above ground; a tunnel's "top" is its roof, level with the normal floor
const supportTop = o => (o.type === 'block' ? BLOCK.h - o.y : o.type === 'tunnel' ? 0 : o.h);
function supportsUnder(lane) {
  const list = lane.obs.filter(o => Math.abs(o.d - player.off) < supportHalf(o));
  const hole = tunnelAt(lane, player.off);
  if (hole && underRoof(lane, player.off)) list.push(hole.t);
  return list;
}

const DEFLECT_T = 0.3, THROW_REL_T = 0.25;  // seconds the swat / enemy follow-through animations last
function updateRunner(lane, r, gy, dt) {
  const prevY = r.y;
  r.deflectT = Math.max(0, (r.deflectT || 0) - dt);
  const sup = supportsUnder(lane);
  const base = floorAt(lane, player.off);
  const standing = sup.find(o => Math.abs(-supportTop(o) - r.y) < 1);
  if (r.grounded && !standing) {
    if (base > r.y + 1) r.grounded = false;                        // floor dropped away (edge or hole)
    else if (base < r.y && r.y - base <= STEP_H + 4) r.y = base;   // walk up a stair step
  }
  const onPlatform = standing && standing.type === 'platform';
  if (r.grounded && onPlatform && keys['s']) { r.grounded = false; r.dropT = 0.2; }  // S drops through
  if (jumpPressed && r.grounded) {
    r.vy = -JUMP_V; r.grounded = false;
    burst(player.off, gy + r.y, 8, 0.6, lane.side);
  }
  r.sliding = r.grounded && !onPlatform && !!keys['s'];
  r.dropT -= dt;
  if (r.grounded) return;
  r.vy += (keys['s'] ? GRAVITY * 2.4 : GRAVITY) * dt;  // S = fast fall
  r.y += r.vy * dt;
  // land on the highest surface we fell onto this frame (a little forgiving)
  let floor = null;
  for (const o of sup) {
    const top = -supportTop(o);
    if (o.type === 'platform' && r.dropT > 0) continue;
    if (r.vy > 0 && prevY <= top + 10 && r.y >= top && (floor === null || top < floor)) floor = top;
  }
  if (floor === null && r.y >= base) floor = base;
  if (floor !== null) { r.y = floor; r.vy = 0; r.grounded = true; burst(player.off, gy + r.y, 6, 0.4, lane.side); }
}

function obstacleBox(o, gy) {
  if (o.type === 'block') return { d0: o.d - BLOCK.half, d1: o.d + BLOCK.half, y0: gy + o.y - BLOCK.h, y1: gy + o.y };
  if (o.type === 'ledge') return { d0: o.d - o.len / 2, d1: o.d + o.len / 2, y0: gy - o.h, y1: gy };
  if (o.type === 'spike') return { d0: o.d - 16, d1: o.d + 16, y0: gy + o.y - 20, y1: gy + o.y };
  if (o.type === 'bar')   return { d0: o.d - 26, d1: o.d + 26, y0: 0, y1: gy + o.y - 46 };
  if (o.type === 'coin' || o.type === 'item' || o.type === 'health') return { d0: o.d - 14, d1: o.d + 14, y0: gy + o.y - 14, y1: gy + o.y + 14 };
  if (o.type === 'star' || o.type === 'grenade') return { d0: o.d - 9, d1: o.d + 9, y0: gy + o.y - 9, y1: gy + o.y + 9 };
  if (o.kind === 'brute') return { d0: o.d - 24, d1: o.d + 24, y0: gy + o.y - 112, y1: gy + o.y };
  return { d0: o.d - 14, d1: o.d + 14, y0: gy + o.y - 72, y1: gy + o.y }; // enemy
}

// ---------- Update ----------
function update(dt) {
  if (game.paused) return;  // the inventory screen freezes everything
  time += dt;
  if (game.state !== 'play') { jumpPressed = punchPressed = false; return; }
  const gy = groundY();
  popups.forEach(p => { p.vy += 500 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.age += dt; });
  popups = popups.filter(p => p.life > 0);
  labels.forEach(l => { l.life -= dt; l.age += dt; l.rise += 22 * dt; });
  if (game.fadeIn > 0) game.fadeIn -= dt;
  labels = labels.filter(l => l.life > 0);
  if (impact) {  // hitstop: freeze the world for a beat on a kill
    impact.t -= dt;
    if (impact.t <= 0) impact = null;
    return;
  }
  // In a boss arena the world stops scrolling; the runners move around on their own.
  // On the way in it brakes, so the runners come to a stop just inside his lair.
  speed = boss ? (boss.state === 'approach' || boss.state === 'exit' ? boss.v : 0) : Math.min(MAX_SPEED, BASE_SPEED + distance / SPEED_RAMP);
  distance += speed * dt;
  if (boss) updateBoss(dt, gy);
  else maybeStartBoss(dt);
  // During the boss intro and death everything but attacking is frozen.
  const frozen = boss && (boss.state === 'intro' || boss.state === 'dying');
  if (frozen) jumpPressed = false;

  // Movement: A/D move both runners back/forward along their lanes (mirrored).
  const move = frozen ? 0 : (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
  player.moving = move !== 0;
  // ease into a slight lean: forward when pushing ahead, back when braking
  player.tilt += ((move > 0 ? 0.20 : move < 0 ? -0.20 : 0) - player.tilt) * Math.min(1, dt * 7);
  if (boss && boss.state !== 'approach' && boss.state !== 'exit') {
    // in the arena you can walk right up to the boss, but not through him
    const limit = boss.state === 'intro' || !boss.alive ? W / 2 - 40 : Math.min(boss.x, W - boss.x) - 48;
    player.off = Math.max(40, Math.min(limit, player.off + move * 220 * dt));
  } else {
    // running: stay back from the seam. Coming out of the arena you may be further forward than
    // that, so drift back into place rather than snapping.
    const max = W / 2 - 160, off = player.off + move * 220 * dt;
    player.off = Math.max(60, off > max ? Math.max(max, Math.min(off, player.off - 160 * dt)) : off);
  }

  for (const lane of lanes) {
    const r = lane.body;
    r.invuln -= dt;
    if (r.hp > 0 && r.hp < MAX_HP && time - r.hitAt > REGEN.delay) r.hp = Math.min(MAX_HP, r.hp + REGEN.rate * dt);
    r.hpLag = r.hpLag > r.hp ? Math.max(r.hp, r.hpLag - 60 * dt) : r.hp;  // the bar's "just lost" chunk drains away
    for (const k in r.cds) r.cds[k] = Math.max(0, r.cds[k] - dt);
  }
  // Clicking attacks with both runners at once: a runner carrying shurikens throws one,
  // an empty-handed runner punches. Each runner has its own cooldown from its weapon's attack
  // speed, so a slow club can be mid-swing while the other side is still punching.
  for (const lane of lanes) {
    const r = lane.body, k0 = swingK(r);
    r.attackCd -= dt; r.swingT += dt;
    // a club or axe hitting the ground kicks up a little dust
    if (attackOf(r).anim === 'club' && k0 < CLUB_KEYS.impact && swingK(r) >= CLUB_KEYS.impact)
      burst(player.off + 45, gy + r.y, 10, 0.5, lane.side, '#ffffff');
  }
  // A click is remembered for a moment, so one made just before the weapon is ready still fires.
  for (const lane of lanes) {
    const r = lane.body;
    const st = r.inv[r.slot], it = st && ITEMS[st.key];
    // automatic weapons keep firing for as long as the mouse is held down
    r.queued = punchPressed || (mouse.held && it && it.auto) ? ATTACK_BUFFER : r.queued - dt;
    if (r.queued > 0 && r.attackCd <= 0) {
      r.queued = 0;
      // what happens depends on the hotbar item in hand: throw it, fire it, use it, swing it, or (anything else) punch
      // Aiming is at the mouse. Mirrored like everything else: the runner on the far side aims at the
      // reflection of the cursor, so in lane-space both use the same point.
      const hand = { d: player.off + 18, y: r.y - STAR.y };
      const aim = { d: Math.min(mouse.x, W - mouse.x), y: mouse.y - gy };
      const dx = aim.d - hand.d, dy = aim.y - hand.y, len = Math.hypot(dx, dy) || 1;
      if (it && it.heal) {  // bandages heal the runner holding one (not wasted at full health or on cooldown)
        if (r.hp < MAX_HP && !(r.cds[st.key] > 0)) {
          r.hp = Math.min(MAX_HP, r.hp + it.heal); r.hpLag = r.hp;
          r.cds[st.key] = it.cooldown || 0;
          if (!--st.n) r.inv[r.slot] = null;
          burst(player.off, gy + r.y - 40, 14, 0.6, lane.side, '#5bd16a');
          popups.push({ x: player.off, y: gy + r.y - 100, vx: 0, vy: -160, text: '+' + it.heal + ' HP', word: true, heal: true, side: lane.side, life: 0.9, age: 0 });
        }
        r.attackCd = 0.4;
        continue;
      }
      if (it && it.throwSpeed) {
        if (!--st.n) r.inv[r.slot] = null;
        r.attack = st.key;
        r.aimA = Math.atan2(dx, dy);  // the throwing arm follows through along this
        const v = it.throwSpeed;
        lane.obs.push({ type: it.lob ? 'grenade' : 'star', item: st.key, friendly: true, d: hand.d, y: hand.y,
                        vd: dx / len * v, vy: dy / len * v, t: 0, bounces: 0, dead: false, hit: false });
        burst(hand.d, gy + hand.y, 8, 0.5, lane.side);  // release flash
      } else if (it && it.beam) {
        r.attack = st.key;
        fireBolt(lane, r, st.key, Math.atan2(dy, dx));
      } else {
        r.attack = it && it.melee ? st.key : 'punch';
        if (attackOf(r).anim === 'punch') r.punchAlt = !r.punchAlt;  // jab, cross, jab...
      }
      r.swingT = 0; r.hits.clear(); r.attackCd = 1 / ATTACK_SPEED[attackOf(r).attackSpeed];
    }
  }
  player.phase += dt * (speed + (player.moving ? 220 : 0)) / 32;

  for (const lane of lanes) {
    lane.hills.forEach(h => { h.x -= speed * 0.25 * dt; if (h.x < -300) h.x += 8 * 220; });
    for (const o of lane.obs) {
      if (o.type === 'slash') { o.t += dt; if (o.t > 0.35) o.dead = true; continue; }
      if (o.type === 'boom' || o.type === 'spark') { o.t += dt; o.d -= speed * dt; if (o.t > (o.type === 'boom' ? 0.4 : 0.12)) o.dead = true; continue; }
      if (o.type === 'bolt') { updateBolt(lane, o, dt, gy); continue; }
      if (o.type === 'grenade') { updateGrenade(lane, o, dt, gy); continue; }
      if (o.type === 'wave') {  // boss slam shockwave: rolls toward you, then fizzles out
        o.d -= BOSS.waveSpeed * dt; o.t += dt;
        if (o.t * BOSS.waveSpeed > BOSS.waveRange) o.dead = true;
        continue;
      }
      if (o.type === 'star') {  // stars fly freely: yours where you aimed, theirs toward you (a bit faster than the ground)
        if (o.friendly) { o.d += o.vd * dt; o.y += o.vy * dt; }
        else o.d -= (speed + STAR.enemySpeed) * dt;
        o.t += dt;
        continue;
      }
      o.stun = Math.max(0, (o.stun || 0) - dt);
      // ground enemies walk toward you (but wait behind an overhead wall rather than walk into it);
      // platform guards and throwers hold their ground
      const walking = o.walks && !o.stun && !lane.obs.some(b => b.type === 'bar' && o.d - b.d > 0 && o.d - b.d < 90);
      const step = o.kind !== 'brute' ? 25 : bruteBusy(o) || o.kb > 30 ? 0 : BRUTE.walk;  // brutes plant their feet to swing
      o.d -= (speed + (walking ? step : 0)) * dt; o.t += dt;
      if (o.kind === 'thrower') updateThrower(lane, o, dt);
      if (o.kind === 'brute') updateBrute(lane, o, dt);
      // walking enemies follow the terrain: hop up onto raised ground, drop into holes
      if (o.walks) {
        const s = surfaceAt(lane, o.d, o.y, true);
        if (s < o.y) o.y = s;
        else if (s > o.y) o.y = Math.min(s, o.y + 500 * dt);
      }
      if (o.grace !== undefined) updateDroppedCoin(lane, o, dt);
    }
    const r = lane.body;
    updateRunner(lane, r, gy, dt);
    const hitting = striking(r);
    const bodyH = r.sliding ? 34 : 70;
    const pb = { d0: player.off - 11, d1: player.off + 11, y0: gy + r.y - bodyH, y1: gy + r.y };
    for (const o of lane.obs) {
      if (o.dead || o.type === 'platform' || o.type === 'tunnel' || o.type === 'slash' || o.type === 'bolt' || o.type === 'boom' || o.type === 'spark') continue;
      if (o.type === 'grenade') {  // goes off on contact with an enemy
        if (lane.obs.some(e => e.type === 'enemy' && !e.dead && overlaps(obstacleBox(o, gy), obstacleBox(e, gy)))) explode(lane, o, gy);
        continue;
      }
      const b = obstacleBox(o, gy);
      const touching = b.d0 < pb.d1 && b.d1 > pb.d0 && b.y0 < pb.y1 && b.y1 > pb.y0;
      if (o.type === 'health') {  // heals whoever grabs it; left lying there if they're already full
        if (touching && !(o.grace > 0) && r.hp < MAX_HP) {
          o.dead = true; r.hp = Math.min(MAX_HP, r.hp + o.heal); r.hpLag = Math.max(r.hpLag, r.hp);
          burst(o.d, gy + o.y, 12, 0.5, lane.side, '#5bd16a');
          popups.push({ x: player.off, y: gy + r.y - 100, vx: 0, vy: -160, text: '+' + o.heal + ' HP', word: true, heal: true, side: lane.side, life: 0.9, age: 0 });
        }
        continue;
      }
      if (o.type === 'coin') {
        if (touching && !(o.grace > 0)) {  // dropped coins pop out for a moment before you can grab them
          o.dead = true; wallet++; player.coins++; saveWallet();
          burst(o.d, gy + o.y, 8, 0.4, lane.side, '#ffd23f');
        }
        continue;
      }
      if (o.type === 'wave') {  // shockwaves roll along the ground: jump them or get up on a platform
        if (!o.hit && r.invuln <= 0 && r.y > -BOSS.waveH && Math.abs(o.d - player.off) < 24) hurtRunner(lane, DAMAGE.wave, gy, o, true);
        if (o.d < -30) o.dead = true;
        continue;
      }
      if (o.type === 'item') {  // only the runner who touches it gets it (if there's room in their inventory)
        if (touching && !(o.grace > 0) && addItem(r, o.item)) {
          o.dead = true; addLabel(lane, o.item);
          burst(o.d, gy + o.y, 8, 0.4, lane.side, RARITY[ITEMS[o.item].rarity]);
        }
        continue;
      }
      if (o.type === 'star') {
        if (o.friendly) {  // your stars (thrown or deflected) hit the first enemy in their path
          const e = lane.obs.find(e => e.type === 'enemy' && !e.dead && overlaps(b, obstacleBox(e, gy)));
          if (e) { o.dead = true; hitEnemy(e, lane, gy, ITEMS.shuriken); }
          if (o.d > W / 2 + 40 || o.d < -40 || gy + o.y < -40 || gy + o.y > H + 40) o.dead = true;
          continue;
        }
        // a punch knocks an incoming star straight back the way it came
        if (hitting && o.d > player.off - 5 && o.d < player.off + attackOf(r).range + 10 &&
            Math.abs(o.y - (r.y - STAR.y)) < 45) {
          o.friendly = true; o.deflected = true; o.vd = ITEMS.shuriken.throwSpeed * 1.2; o.vy = 0;
          r.deflectT = DEFLECT_T;
          // its own little moment: a quick freeze, a white parry flash and a callout
          impact = { t: 0.06, dur: 0.06, deflect: true, side: lane.side, x: o.d, y: gy + o.y };
          burst(o.d, gy + o.y, 16, 0.9, lane.side, '#ffffff');
          burst(o.d, gy + o.y, 8, 0.6, lane.side);
          popups.push({ x: o.d, y: gy + o.y - 34, vx: 30, vy: -200, text: 'DEFLECT', word: true, side: lane.side, life: 0.8, age: 0 });
          continue;
        }
        if (touching && r.invuln <= 0) { hurtRunner(lane, DAMAGE.star, gy, o, true); o.dead = true; }
        continue;
      }
      // Blocks and ledges are safe to stand on; only running into the side hurts,
      // and then you get bumped up on top so you're not stuck inside the wall.
      if (isSolid(o)) {
        if (r.y <= -supportTop(o) + 8 || !touching) continue;
        if (!o.hit && r.invuln <= 0) hurtRunner(lane, DAMAGE[o.type], gy, o);
        r.y = -supportTop(o); r.vy = 0; r.grounded = true;
        continue;
      }
      // a brute's axe only hurts while it's coming down, anywhere in front of him or over his head
      if (o.kind === 'brute' && o.swingT > 0 && !o.swingHit && r.invuln <= 0 && overlaps(bruteZone(o, gy), pb)) {
        o.swingHit = true; hurtRunner(lane, DAMAGE.axe, gy, {}, true); shake = Math.max(shake, 10);
      }
      // Each punch can hit each enemy once; both runners punch, so it lands in either lane
      // (as long as that runner is roughly on the enemy's level).
      if (o.type === 'enemy' && hitting && !r.hits.has(o) && Math.abs(r.y - o.y) < 60 &&
          b.d0 < player.off + attackOf(r).range && b.d1 > player.off - 5) {
        r.hits.add(o);
        hitEnemy(o, lane, gy, attackOf(r));
        continue;
      }
      if (!o.hit && r.invuln <= 0 && touching) {
        hurtRunner(lane, DAMAGE[o.kind] || DAMAGE[o.type] || DAMAGE.enemy, gy, o, o.type === 'enemy');
        // a brute doesn't fall over when he walks into you: he shoves you off and keeps coming
        if (o.kind === 'brute') { o.hit = false; if (o.d > player.off - 5) o.kb = Math.max(o.kb, 150 * BRUTE.kbDecay); }
      }
    }
    if (boss) bossVsRunner(lane, r, pb, hitting, gy);
    lane.obs = lane.obs.filter(o => o.d + (o.len || 0) / 2 > -60 && !o.dead);
  }
  jumpPressed = punchPressed = false;

  if (!boss) {
    nextBeat -= speed * dt;
    if (nextBeat <= 0) { spawnBeat(); nextBeat = 560 + Math.random() * 300 + speed * 0.5; }
    nextPlatform -= speed * dt;
    if (nextPlatform <= 0) { spawnPlatform(); nextPlatform = 1000 + Math.random() * 700; }
  }

  particles.forEach(p => { p.vy += 1400 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; p.rot += (p.spin || 0) * dt; });
  particles = particles.filter(p => p.life > 0);
  shake *= Math.pow(0.002, dt);
}

// `blockable` marks enemy attacks (not terrain or your own grenades): a blocking weapon in hand can turn them aside.
function hurtRunner(lane, dmg, gy, o = {}, blockable = false) {
  const r = lane.body, held = ITEMS[heldKey(r)];
  o.hit = true;
  if (blockable && held && held.block && Math.random() < held.block) return blockHit(lane, gy);
  r.invuln = INVULN_T; r.hitAt = time; shake = 16;
  r.hp = Math.max(0, r.hp - dmg);
  burst(player.off, gy + r.y - 35, 20, 1.2, lane.side);
  popups.push({ x: player.off, y: gy + r.y - 95, vx: -40, vy: -220, text: '-' + dmg, hurt: true, side: lane.side, life: 0.9, age: 0 });
  if (r.hp <= 0) {  // one down is everyone down
    game.state = 'over'; game.fallen = lane.side; game.best = Math.max(game.best, Math.floor(distance / 10));
  }
}

function blockHit(lane, gy) {
  const x = player.off + 16, y = gy + lane.body.y - 42;
  impact = { t: 0.06, dur: 0.06, deflect: true, side: lane.side, x, y };  // same parry flash as a deflect
  burst(x, y, 16, 0.9, lane.side, '#ffffff');
  burst(x, y, 8, 0.6, lane.side);
  popups.push({ x, y: y - 34, vx: 30, vy: -200, text: 'BLOCK', word: true, side: lane.side, life: 0.8, age: 0 });
}

// Coin drops: 1-3 is the usual haul, 4-6 is a lucky one.
const COIN_DROP_WEIGHTS = [0, 30, 30, 25, 8, 5, 2];  // index = number of coins
function rollCoinDrop() {
  let r = Math.random() * COIN_DROP_WEIGHTS.reduce((a, b) => a + b);
  for (let n = 1; n < COIN_DROP_WEIGHTS.length; n++) if ((r -= COIN_DROP_WEIGHTS[n]) < 0) return n;
  return 1;
}
function dropHealth(lane, e, heal) {
  lane.obs.push({ type: 'health', heal, d: e.d, y: e.y - 40, t: Math.random() * 6, dead: false, hit: false,
                  vd: 40 + Math.random() * 160, vy: -420 - Math.random() * 200, grace: 0.15 });
}
function dropCoins(lane, e) {
  const n = rollCoinDrop();
  for (let i = 0; i < n; i++) lane.obs.push({
    type: 'coin', d: e.d, y: e.y - 40, t: Math.random() * 6, dead: false, hit: false,
    vd: 40 + Math.random() * 200, vy: -380 - Math.random() * 260, grace: 0.15 });  // fly toward the seam so they come back to you
}
// Dropped coins fly out, then settle on whatever is beneath them (ground, ledge, platform, tunnel floor).
function updateDroppedCoin(lane, o, dt) {
  o.grace -= dt;
  if (o.vy === null) return;
  o.vy += 1400 * dt; o.y += o.vy * dt; o.d += o.vd * dt;
  let rest = surfaceAt(lane, o.d, o.y - 14);
  for (const p of lane.obs) if (p.type === 'platform' && Math.abs(p.d - o.d) < p.len / 2 && -p.h >= o.y - 20) rest = Math.min(rest, -p.h);
  if (o.vy > 0 && o.y >= rest - 14) {
    o.y = rest - 14;
    if (o.vy > 260) { o.vy *= -0.35; o.vd *= 0.5; } else { o.vy = null; o.vd = 0; }
  }
}

const overlaps = (a, b) => a.d0 < b.d1 && a.d1 > b.d0 && a.y0 < b.y1 && a.y1 > b.y0;

// Brutes lumber forward and, once you're in reach (or right over them), wind up and swing.
const bruteBusy = o => o.windT > 0 || o.swingT > 0 || o.recT > 0;
const bruteZone = (o, gy) => ({ d0: o.d - BRUTE.reach, d1: o.d + 30, y0: gy + o.y - BRUTE.zone.hi, y1: gy + o.y - BRUTE.zone.lo });
function updateBrute(lane, o, dt) {
  o.flashT -= dt; o.cd -= dt;
  if (o.kb > 1) { o.d = Math.min(W / 2 - 30, o.d + o.kb * dt); o.kb *= Math.exp(-BRUTE.kbDecay * dt); } else o.kb = 0;
  if (o.windT > 0) {
    o.windT -= dt;
    if (o.windT <= 0) { o.swingT = BRUTE.swing; o.swingHit = false; }
    return;
  }
  if (o.swingT > 0) {
    o.swingT -= dt;
    if (o.swingT <= 0) { o.recT = BRUTE.recover; burst(o.d - BRUTE.reach * 0.7, groundY() + o.y - 50, 10, 0.6, lane.side, '#ffffff'); }
    return;
  }
  if (o.recT > 0) { o.recT -= dt; return; }
  const gap = o.d - player.off;
  if (o.cd <= 0 && gap < BRUTE.reach + 30 && gap > -30 && o.d < W / 2 - 20 && Math.abs(lane.body.y - o.y) < 260) {
    o.windT = BRUTE.windup; o.cd = BRUTE.cycle;
  }
}
// Hits shove a brute back: enough to cover the ground that scrolls by before this weapon is ready
// again, plus a little, so the fight stays in front of you.
function knockBrute(o, weapon) {
  const push = speed / ATTACK_SPEED[weapon.attackSpeed] + BRUTE.kbExtra;
  o.kb = Math.max(o.kb, push * BRUTE.kbDecay);  // eased out, it covers push px in total
}

// Throwers stand their ground and, once on screen, wind up and toss a slow shuriken every few seconds.
function updateThrower(lane, o, dt) {
  o.relT -= dt;
  if (o.windT > 0) {
    o.windT -= dt;
    if (o.windT <= 0) {
      lane.obs.push({ type: 'star', friendly: false, d: o.d - 16, y: o.y - STAR.y, t: 0, dead: false, hit: false });
      o.relT = THROW_REL_T;
    }
    return;
  }
  if (o.d < W / 2 - 30 && o.d > player.off + 140) {
    o.throwCd -= dt;
    if (o.throwCd <= 0) { o.windT = STAR.windup; o.throwCd = STAR.cooldown; }
  }
}

function rollWeighted(weights) {
  let r = Math.random() * weights.reduce((a, b) => a + b);
  for (let n = 0; n < weights.length; n++) if ((r -= weights[n]) < 0) return n;
  return 0;
}
// Dropped items use the same pop-out physics as dropped coins.
function dropItems(lane, e, item, n) {
  for (let i = 0; i < n; i++) lane.obs.push({
    type: 'item', item, d: e.d, y: e.y - 40, t: Math.random() * 6, dead: false, hit: false,
    vd: 40 + Math.random() * 200, vy: -420 - Math.random() * 260, grace: 0.15 });
}
// Terraria-style pickup label over the runner who grabbed it; repeat pickups merge into "(2)", "(3)"...
function addLabel(lane, key) {
  const it = ITEMS[key];
  const ex = labels.find(l => l.side === lane.side && l.key === key && l.life > 0.4);
  if (ex) { ex.count++; ex.life = 1.8; ex.age = 0; return; }
  labels.push({ side: lane.side, key, text: it.name, color: RARITY[it.rarity], count: 1, life: 1.8, age: 0, rise: 0 });
}

function hitEnemy(o, lane, gy, weapon = PUNCH) {
  const crit = Math.random() < weapon.critChance;
  const dmg = Math.round((weapon.min + Math.random() * (weapon.max - weapon.min)) * (crit ? weapon.critMult : 1));
  o.hp -= dmg;
  const fy = gy + o.y;  // the enemy's feet
  const brute = o.kind === 'brute';
  popups.push({ x: o.d, y: fy - (brute ? 135 : 90), vx: 40 + Math.random() * 60, vy: -260, text: dmg, crit,
                side: lane.side, life: 1.0, age: 0 });
  if (o.hp <= 0) {
    o.dead = true;
    // (screen shake is saved for truly big moments: explosions, boss hits)
    impact = { t: crit ? 0.13 : 0.07, dur: crit ? 0.13 : 0.07, crit, side: lane.side, x: o.d, y: fy - (brute ? 60 : 40) };
    burst(o.d, fy - 45, crit ? 40 : 26, crit ? 1.8 : 1.3, lane.side);
    if (crit) burst(o.d, fy - 45, 24, 1.5, lane.side, '#ffd23f');
    dropCoins(lane, o);
    if (lane.body.hp < MAX_HP && Math.random() < HEALTH_DROP.chance) dropHealth(lane, o, HEALTH_DROP.enemyHeal);
    if (o.kind === 'thrower') dropItems(lane, o, 'shuriken', rollWeighted(SHURIKEN_DROP_WEIGHTS));
    if (brute) { dropCoins(lane, o); if (Math.random() < BRUTE.axeDrop) dropItems(lane, o, 'axe', 1); }
    // the enemy's body snaps apart into flying sticks
    for (let i = 0; i < (brute ? 10 : 6); i++) particles.push({
      x: o.d, y: fy - 20 - Math.random() * 50, vx: 150 + Math.random() * 350, vy: -300 - Math.random() * 400,
      life: 1.2, side: lane.side, stick: 12 + Math.random() * 8, rot: Math.random() * 6, spin: (Math.random() - 0.5) * 30 });
  } else {
    // (no knockback, except on brutes: a hit that doesn't kill just sparks)
    burst(o.d, fy - (brute ? 65 : 45), 10, 0.8, lane.side);
    if (brute) { knockBrute(o, weapon); o.flashT = 0.07; }
  }
}

// Where (0-1 along it) the segment (x0, y0)-(x1, y1) enters box b, or -1 if it misses. (Liang-Barsky clipping)
function segEnter(x0, y0, x1, y1, b) {
  const dx = x1 - x0, dy = y1 - y0;
  let t0 = 0, t1 = 1;
  for (const [p, q] of [[-dx, x0 - b.d0], [dx, b.d1 - x0], [-dy, y0 - b.y0], [dy, b.y1 - y0]]) {
    if (p === 0) { if (q < 0) return -1; continue; }
    const t = q / p;
    if (p < 0) { if (t > t1) return -1; t0 = Math.max(t0, t); }
    else { if (t < t0) return -1; t1 = Math.min(t1, t); }
  }
  return t0;
}
const segHitsBox = (x0, y0, x1, y1, b) => segEnter(x0, y0, x1, y1, b) >= 0;
const bossBox = (side, gy) => { const d = bossD(side); return { d0: d - 36, d1: d + 36, y0: gy + boss.y - 175 * BOSS.scale, y1: gy + boss.y }; };

// Laser gun: each shot is a fast bolt sprayed out of the muzzle with a bit of random spread. A bolt
// flies straight through floating platforms (and tunnel roofs), but stops at the first other thing it
// meets: an enemy, an enemy star, the boss, a block, ledge, spikes, an overhead wall or the ground.
// The muzzle position and aim come from where the gun was drawn last frame (see drawLane), so the
// bolts leave the barrel itself.
const BOLT = { speed: 2300, spread: 0.09, len: 30 };
function fireBolt(lane, r, key, fallbackA) {
  const m = r.muzzle, a = (m ? m.a : fallbackA) + (Math.random() - 0.5) * 2 * BOLT.spread;
  const d = m ? player.off + m.dd : player.off + 18, y = m ? r.y + m.dy : r.y - STAR.y;
  const v = BOLT.speed * (0.9 + Math.random() * 0.2);
  lane.obs.push({ type: 'bolt', item: key, d, y, vd: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, hits: new Set(), dead: false, hit: false });
  burst(d, groundY() + y, 3, 0.3, lane.side, '#ff2b6a');
}
const BOLT_STOPS = ['enemy', 'star', 'block', 'ledge', 'spike', 'bar'];
function updateBolt(lane, o, dt, gy) {
  const x0 = o.d, y0 = gy + o.y;
  o.d += o.vd * dt; o.y += o.vy * dt; o.t += dt;
  const x1 = o.d, y1 = gy + o.y;
  // Test the whole stretch it covered this frame (so a fast bolt can't skip over anything) and
  // take whatever it reached first.
  let first = 1.01, target = null;
  for (const e of lane.obs) {
    if (e.dead || !BOLT_STOPS.includes(e.type) || (e.type === 'star' && e.friendly) || e.d > W / 2 + 10) continue;
    const t = segEnter(x0, y0, x1, y1, obstacleBox(e, gy));
    if (t >= 0 && t < first) { first = t; target = e; }
  }
  if (boss && boss.alive) {
    const t = segEnter(x0, y0, x1, y1, bossBox(lane.side, gy));
    if (t >= 0 && t < first) { first = t; target = 'boss'; }
  }
  // the ground (or the floor of a tunnel), checked at a few points along the way
  for (let k = 1; k <= 4; k++) {
    const t = k / 4;
    if (t >= first) break;
    if (o.y - (1 - t) * o.vy * dt >= floorAt(lane, x0 + (x1 - x0) * t)) { first = t; target = 'ground'; break; }
  }
  if (target) {
    const hx = x0 + (x1 - x0) * first, hy = y0 + (y1 - y0) * first, it = ITEMS[o.item];
    if (target === 'boss') hitBoss(lane, it, gy);
    else if (target !== 'ground' && target.type === 'enemy') hitEnemy(target, lane, gy, it);
    else if (target !== 'ground' && target.type === 'star') target.dead = true;
    o.dead = true;
    // sparks: a white-hot splash and some pink embers, with a quick flash where it struck
    burst(hx, hy, 9, 0.7, lane.side, '#ffffff');
    burst(hx, hy, 6, 0.5, lane.side, '#ff2b6a');
    lane.obs.push({ type: 'spark', d: hx, y: hy - gy, a: Math.atan2(o.vy, o.vd), t: 0, dead: false, hit: false });
    return;
  }
  if (x1 > W / 2 + 60 || x1 < -60 || y1 < -60 || y1 > H + 60) o.dead = true;
}

// Grenades fly in an arc and bounce off whatever floor is under them; the second bounce sets them off.
function updateGrenade(lane, o, dt, gy) {
  o.t += dt; o.vy += 1400 * dt; o.y += o.vy * dt; o.d += o.vd * dt;  // carried along at the runner's pace, like shurikens
  let rest = surfaceAt(lane, o.d, o.y - 8);
  for (const p of lane.obs) if (p.type === 'platform' && Math.abs(p.d - o.d) < p.len / 2 && -p.h >= o.y - 20) rest = Math.min(rest, -p.h);
  if (o.vy > 0 && o.y >= rest - 8) {
    if (++o.bounces >= 2) return explode(lane, o, gy);
    o.y = rest - 8; o.vy *= -0.55; o.vd *= 0.7;
    burst(o.d, gy + o.y + 8, 4, 0.3, lane.side, '#ffffff');
  }
  if (o.d > W / 2 + 40 || o.d < -40 || gy + o.y > H + 40) o.dead = true;
}
// Blast damage to everything in range, the boss included. Too close and it gets the thrower too.
function explode(lane, o, gy) {
  const it = ITEMS[o.item], R = it.aoe, cx = o.d, cy = gy + o.y, r = lane.body;
  o.dead = true;
  for (const e of lane.obs) {
    if (e.dead) continue;
    if (e.type === 'enemy' && Math.hypot(e.d - cx, gy + e.y - 36 - cy) < R + 14) hitEnemy(e, lane, gy, it);
    else if (e.type === 'star' && !e.friendly && Math.hypot(e.d - cx, gy + e.y - cy) < R) e.dead = true;
  }
  if (boss && boss.alive) {
    const b = bossBox(lane.side, gy);
    if (cx > b.d0 - R && cx < b.d1 + R && cy > b.y0 - R && cy < b.y1 + R) hitBoss(lane, it, gy);
  }
  // the closer to the blast, the more it hurts (up to the grenade's full damage)
  const near = Math.hypot(player.off - cx, gy + r.y - 35 - cy);
  if (r.invuln <= 0 && near < R * 0.75) hurtRunner(lane, Math.round(it.min * (1 - near / R)), gy);
  lane.obs.push({ type: 'boom', d: cx, y: o.y, r: R, t: 0, dead: false, hit: false });
  burst(cx, cy, 30, 1.4, lane.side, '#ffb347');
  burst(cx, cy, 14, 1.0, lane.side, '#ffffff');
  shake = Math.max(shake, 12);
}

// Particles are stored in lane-space (d) and drawn on both sides unless tied to one lane.
function burst(d, y, n, power, side = 0, color = null) {
  for (let i = 0; i < n; i++) {
    const a = -Math.PI * Math.random();
    const s = (120 + Math.random() * 380) * power;
    particles.push({ x: d, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 0.4 + Math.random() * 0.5, side, r: 2 + Math.random() * 3, rot: 0, color });
  }
}

// ---------- Boss fight ----------
// The boss lives in screen space and straddles the mirror seam: boss.x is a screen x, so each
// runner sees him at its own lane distance (left: x, right: W - x). boss.y is height (negative = up).
const bossD = side => (side < 0 ? boss.x : W - boss.x);
// the target side's runner stands at lane distance player.off; the boss wants to be `reach` in front
const bossSpotFor = side => (side < 0 ? player.off + BOSS.reach : W - player.off - BOSS.reach);
const SWINGS = ['swing', 'rageSwing'];  // states where the club is actually connecting

function maybeStartBoss(dt) {
  if (game.bossDefeated || time < BOSS.after) return;
  game.bossCheck -= dt;
  if (game.bossCheck > 0) return;
  game.bossCheck = BOSS.checkEvery;
  if (Math.random() < BOSS.chance) startBoss();
}

// The run doesn't cut to the fight: new obstacles stop, the mouth of his lair comes into view past
// whatever's still on the course, and the runners brake to a stop once it's behind them and off-screen,
// so the lair fills the whole screen. Leaving works the same way in reverse: they walk, then run,
// out through the far side.
const LAIR = {
  brake: 130,         // px of braking on the way in
  stopAt: -60,        // where the entrance ends up (lane space; below 0 is off-screen behind the runners)
  exitAt: 120,        // how far past the seam the way out starts, so it scrolls in from off-screen
  walkOut: 1.8,       // s to go from standing to full running speed on the way out
};
function startBoss() {
  let gateD = W / 2 + 150;  // past everything still on the course, so the lair is clear when they stop
  for (const lane of lanes) for (const o of lane.obs) gateD = Math.max(gateD, o.d + (o.len || 0) / 2 + 250);
  boss = { state: 'approach', t: 0, x: W / 2, y: -H, f: -1, target: Math.random() < 0.5 ? -1 : 1,
           hp: BOSS.hp, maxHp: BOSS.hp, attacks: 0, flashT: 0, swingHit: {}, zones: {}, endA: 0.4, barFill: 0,
           alive: false, arena: false, landed: false, stamped: false, exploded: false,
           gateD, exitD: Infinity, v: speed, v0: speed };
}

// Each side gets its own platform layout, so the two runners naturally end up on different levels.
// [position across that half of the screen, length, height above the floor]
const ARENA = {
  '-1': [[0.20, 120, 120], [0.50, 130, 210], [0.78, 110, 135]],
  '1':  [[0.30, 140, 95], [0.58, 120, 180], [0.84, 100, 255]],
};
// Fill the lair with the arena's floating platforms to escape onto. They drop in one after another
// from up in the cave roof (`h` animates down to `h0`; see updateBoss).
function setupArena() {
  const half = W / 2;
  for (const lane of lanes) {
    const loot = lane.obs.filter(o => o.type === 'coin' || o.type === 'item' || o.type === 'health');
    lane.obs = [...loot, ...ARENA[lane.side].map(([p, len, h0], i) =>
      ({ type: 'platform', d: half * p, len, h: h0 + H, h0, delay: 0.1 + i * 0.16, y: 0, t: 0, dead: false }))];
    Object.assign(lane.body, { sliding: false, deflectT: 0 });
  }
  lanes.forEach(l => { l.body.invuln = 0; });
}

// --- Where a swing will land. Zones are in lane coordinates with heights above the floor. ---
function bandAround(side) {
  const h = -lanes[side < 0 ? 0 : 1].body.y;
  return { lo: Math.max(0, h - BOSS.band.below), hi: h + BOSS.band.above };
}
const zoneBox = (z, gy) => ({ d0: z.d0, d1: z.d1, y0: gy - z.hi, y1: gy - z.lo });
// club angle (0 = forward, negative = up) that brings its head through the middle of the zone
const clubAngleFor = z => Math.asin(Math.max(-1, Math.min(1, (BOSS.shoulderH - (z.lo + z.hi) / 2) / BOSS.clubLen)));
// The strip in front of him when he swings from lane distance dBoss, at that side's runner's height.
// It also keeps the swing's geometry (shoulder position, start and end angle) so the warning can
// trace the club's path before it happens.
function swingZone(side, dBoss) {
  const z = { d0: dBoss - BOSS.swingFar, d1: dBoss - BOSS.swingNear, ...bandAround(side) };
  return { ...z, sd: dBoss - 14 * BOSS.scale, sh: BOSS.shoulderH, a0: -2.9, a1: clubAngleFor(z) };
}
// where his lane distance will be after lunging at a side (the spot `reach` in front of its runner)
const rageSpotD = () => player.off + BOSS.reach;

// remember when a zone appeared and when it will be hit, so its warning can build up to the moment
const timed = (z, inSecs) => ({ ...z, t0: time, hitAt: time + inSecs });
function bossState(s) { boss.state = s; boss.t = 0; }
function startSwing(side, state) {
  const b = boss;
  b.f = side; b.swingSide = side; b.swingHit[side] = false; b.endA = clubAngleFor(b.zones[side]);
  bossState(state);
}

function updateBoss(dt, gy) {
  const b = boss;
  b.t += dt; b.flashT -= dt;
  switch (b.state) {
    case 'approach': {
      // full speed until the entrance is close, then brake evenly so it stops just behind the runners
      b.gateD -= speed * dt;
      const left = b.gateD - LAIR.stopAt;
      if (left < LAIR.brake) {
        b.v = b.v0 * Math.sqrt(Math.max(0, left) / LAIR.brake);
        // skidding to a halt kicks up dust at their heels
        if (Math.random() < 0.6) for (const lane of lanes) if (lane.body.grounded)
          burst(player.off - 8, gy + lane.body.y, 1, 0.35, lane.side, '#ffffff');
      }
      if (left <= 0.5 || b.v < 4) { b.v = 0; bossState('intro'); }
      break;
    }
    case 'intro': {
      // they've stopped: a beat of rumbling; 0.4 he drops in, slamming down at 0.7, and the platforms
      // fall into place after him; 1.15 title stamps; 1.6 health bar fills; 2.7 fight
      if (b.t < 0.4) shake = Math.max(shake, 3);
      if (b.t >= 0.4 && !b.landed) {
        b.arena = true;
        const k = Math.min(1, (b.t - 0.4) / 0.3);
        b.y = -H * (1 - k * k);
        if (k >= 1) {
          b.y = 0; b.landed = true; shake = 26; setupArena(); b.landT = b.t;
          for (const lane of lanes) { burst(bossD(lane.side), gy, 30, 1.4, lane.side); burst(bossD(lane.side), gy, 12, 1, lane.side, '#ffffff'); }
        }
      }
      if (b.landed) for (const lane of lanes) for (const o of lane.obs) {
        if (o.type !== 'platform' || o.h === o.h0) continue;
        const k = Math.min(1, Math.max(0, (b.t - b.landT - o.delay) / 0.28));
        o.h = o.h0 + H * (1 - k * k);
        if (k >= 1) { o.h = o.h0; burst(o.d, gy - o.h0, 12, 0.6, lane.side, '#ffffff'); }
      }
      if (!b.stamped && b.t >= 1.33) { b.stamped = true; shake = Math.max(shake, 12); }
      b.barFill = Math.max(0, Math.min(1, (b.t - 1.6) / 0.7));
      if (b.t >= 2.7) { b.alive = true; bossState('walk'); }
      break;
    }
    case 'walk': {
      b.f = b.target;
      const spot = bossSpotFor(b.target), dx = spot - b.x;
      b.x += Math.sign(dx) * Math.min(Math.abs(dx), BOSS.walkSpeed * dt);
      if (Math.abs(dx) < 4 || b.t > 3) { b.zones = { [b.target]: timed(swingZone(b.target, bossD(b.target)), BOSS.windup) }; bossState('windup'); }
      break;
    }
    case 'windup':
      if (b.t >= BOSS.windup) startSwing(b.f, 'swing');
      break;
    case 'swing':
      if (b.t >= BOSS.swing) { b.attacks++; delete b.zones[b.f]; bossState('recover'); }
      break;
    case 'recover':
      if (b.t >= (b.lastRage ? BOSS.rage.recover : BOSS.recover)) {
        b.lastRage = false;
        // the rotation: swing, swing, leap, swing, rage, repeat
        const n = b.attacks % 5;
        bossState(n === 2 ? 'crouch' : n === 4 ? 'toCenter' : 'walk');
      }
      break;
    case 'crouch':  // he hops toward the other runner and slams the ground
      if (b.t >= BOSS.crouch) {
        b.target = -b.target; b.f = b.target;
        const lo = bossSpotFor(-1), hi = bossSpotFor(1);
        b.leapFrom = b.x; b.leapTo = Math.max(lo, Math.min(hi, b.x + b.target * BOSS.leapDist));
        bossState('leap');
      }
      break;
    case 'leap': {
      const k = Math.min(1, b.t / BOSS.leapT);
      b.x = b.leapFrom + (b.leapTo - b.leapFrom) * k;
      b.y = -4 * BOSS.leapH * k * (1 - k);
      if (k >= 1) {
        b.y = 0; b.attacks++; shake = 20;
        for (const lane of lanes) {
          const d = bossD(lane.side) - 30;
          lane.obs.push({ type: 'wave', side: lane.side, d, end: d - BOSS.waveRange, t: 0, dead: false, hit: false, y: 0 });
          burst(bossD(lane.side), gy, 26, 1.2, lane.side);
        }
        bossState('recover');
      }
      break;
    }
    case 'toCenter': {  // rage attack: stomp back to the middle...
      const dx = W / 2 - b.x;
      b.f = dx < 0 ? -1 : 1;
      b.x += Math.sign(dx) * Math.min(Math.abs(dx), BOSS.walkSpeed * 1.4 * dt);
      if (Math.abs(dx) < 4 || b.t > 4) bossState('roar');
      break;
    }
    case 'roar':  // ...roar...
      shake = Math.max(shake, 4);
      if (Math.random() < 0.5) for (const lane of lanes) burst(bossD(lane.side) + 10, gy - 150, 1, 0.5, lane.side, '#ff3b3b');
      if (b.t >= BOSS.rage.roar) { b.rageSide = Math.random() < 0.5 ? -1 : 1; b.rageCount = 0; rageWindup(); }
      break;
    case 'rageWindup':  // ...wind up facing one side, with that side's slam marked...
      if (b.t >= BOSS.rage.windup) {
        b.lungeFrom = b.x; b.lungeTo = bossSpotFor(b.rageSide);
        startSwing(b.rageSide, 'rageSwing');
      }
      break;
    case 'rageSwing': {  // ...lunge in and slam it down...
      const k = Math.min(1, b.t / (BOSS.rage.swing * 0.6));
      b.x = b.lungeFrom + (b.lungeTo - b.lungeFrom) * easeOut(k);
      if (b.t >= BOSS.rage.swing) {
        rageImpact(b.rageSide, gy);
        if (++b.rageCount < 2) { b.backFrom = b.x; bossState('rageBack'); }
        else { b.attacks++; b.lastRage = true; bossState('recover'); }
      }
      break;
    }
    case 'rageBack': {  // ...hop back to the middle and go for the other side.
      const k = Math.min(1, b.t / BOSS.rage.back);
      b.x = b.backFrom + (W / 2 - b.backFrom) * easeOut(k);
      b.y = -60 * Math.sin(Math.PI * k);
      if (k >= 1) { b.y = 0; b.rageSide = -b.rageSide; rageWindup(); }
      break;
    }
    case 'dying':
      // shudder and flash, then blow apart, drop the loot and stamp the banner
      if (b.t < 1.2) { shake = Math.max(shake, 5); if (Math.random() < 0.3) b.flashT = 0.05; }
      if (!b.exploded && b.t >= 1.2) bossExplode(gy);
      if (b.t >= 2.4) magnetLoot(dt, gy);  // anything left on the floor flies to its runner
      if (b.t >= 4.6) bossState('exit');
      break;
    case 'exit': {
      // the far side of the lair opens up ahead; they set off walking, pick up into a run, and the
      // arena scrolls away behind them. Once the way out is off-screen it's back to the normal run.
      magnetLoot(dt, gy);
      if (b.exitD === Infinity) b.exitD = W / 2 + LAIR.exitAt;
      const k = Math.min(1, b.t / LAIR.walkOut);
      b.v = Math.min(MAX_SPEED, BASE_SPEED + distance / SPEED_RAMP) * k * k;
      b.gateD -= speed * dt; b.exitD -= speed * dt;
      if (b.exitD < LAIR.stopAt) {
        boss = null; game.bossDefeated = true;
        nextBeat = 300; nextPlatform = 800;
      }
      break;
    }
  }
}

// Turn to the next side and mark where the lunge-slam will land.
function rageWindup() {
  const b = boss;
  b.f = b.rageSide;
  b.zones = { [b.rageSide]: timed(swingZone(b.rageSide, rageSpotD()), BOSS.rage.windup) };
  bossState('rageWindup');
}

// A rage slam lands: a slash mark and debris where it hit.
function rageImpact(side, gy) {
  const z = boss.zones[side], lane = lanes[side < 0 ? 0 : 1];
  const d = (z.d0 + z.d1) / 2, y = -(z.lo + z.hi) / 2;
  lane.obs.push({ type: 'slash', d, y, t: 0, dead: false, hit: false });
  burst(d, gy + y, 18, 1.1, side, '#ff3b3b');
  shake = Math.max(shake, 8);
  delete boss.zones[side];
}

// Everything between the boss and one runner: your hits on him, his club and his body.
function bossVsRunner(lane, r, pb, hitting, gy) {
  const b = boss;
  if (!b.alive) return;
  const bb = bossBox(lane.side, gy);
  const melee = attackOf(r), key = 'boss' + lane.side;
  if (hitting && !r.hits.has(key) &&
      bb.d0 < player.off + melee.range && bb.d1 > player.off - 5 && bb.y0 < pb.y1 && bb.y1 > pb.y0) {
    r.hits.add(key);
    hitBoss(lane, melee, gy);
  }
  for (const o of lane.obs) {
    if (o.type !== 'star' || !o.friendly || o.dead || !boss.alive) continue;
    if (overlaps(obstacleBox(o, gy), bb)) { o.dead = true; hitBoss(lane, ITEMS.shuriken, gy); }
  }
  for (const o of lane.obs) if (o.type === 'grenade' && !o.dead && boss.alive && overlaps(obstacleBox(o, gy), bb)) explode(lane, o, gy);
  // a swing only hurts in its marked zone, on the side it's aimed at
  const z = b.zones[lane.side];
  if (z && SWINGS.includes(b.state) && b.swingSide === lane.side && !b.swingHit[lane.side] && r.invuln <= 0 &&
      overlaps(zoneBox(z, gy), pb)) {
    b.swingHit[lane.side] = true; hurtRunner(lane, b.state === 'rageSwing' ? DAMAGE.rage : DAMAGE.club, gy, {}, true); shake = Math.max(shake, 10);
  }
}

function hitBoss(lane, weapon, gy) {
  const b = boss;
  const crit = Math.random() < weapon.critChance;
  const dmg = Math.round((weapon.min + Math.random() * (weapon.max - weapon.min)) * (crit ? weapon.critMult : 1));
  b.hp = Math.max(0, b.hp - dmg); b.flashT = 0.07;
  const d = bossD(lane.side);
  popups.push({ x: d - 20, y: groundY() + b.y - 190, vx: -40 - Math.random() * 60, vy: -260, text: dmg, crit,
                side: lane.side, life: 1.0, age: 0 });
  burst(d - 40, gy + b.y - 90, crit ? 18 : 10, crit ? 1.2 : 0.8, lane.side, crit ? '#ffd23f' : null);
  if (b.hp <= 0) {
    b.alive = false; b.killSide = lane.side; shake = 30;
    for (const l of lanes) l.obs = l.obs.filter(o => o.type !== 'wave' && !(o.type === 'star' && !o.friendly));
    bossState('dying');
  }
}

function bossExplode(gy) {
  const b = boss;
  b.exploded = true; shake = 34;
  for (const lane of lanes) {
    const d = bossD(lane.side);
    burst(d, gy - 100, 50, 2.2, lane.side);
    burst(d, gy - 100, 24, 1.6, lane.side, '#ffffff');
    for (let i = 0; i < 10; i++) particles.push({
      x: d, y: gy - 40 - Math.random() * 130, vx: (Math.random() - 0.3) * -700, vy: -400 - Math.random() * 500,
      life: 1.6, side: lane.side, stick: 18 + Math.random() * 18, rot: Math.random() * 6, spin: (Math.random() - 0.5) * 24 });
    // loot: a shower of coins on both sides, and the club goes to whoever landed the final blow
    for (let i = 0; i < 2; i++) dropCoins(lane, { d: d - 30, y: 0 });
    for (let i = 0; i < HEALTH_DROP.bossCount; i++) dropHealth(lane, { d: d - 30, y: 0 }, HEALTH_DROP.bossHeal);
    for (let i = 0; i < 6; i++) lane.obs.push({ type: 'coin', d: d - 30, y: -40, t: Math.random() * 6, dead: false, hit: false,
      vd: -60 - Math.random() * 240, vy: -380 - Math.random() * 300, grace: 0.15 });
    if (lane.side === b.killSide) {
      lane.obs.push({ type: 'item', item: 'club', d: d - 40, y: -40, t: 0, dead: false, hit: false,
                      vd: -160, vy: -560, grace: 0.15 });
    }
  }
}

// After the boss dies, leftover loot drifts to the runner on its side so nothing gets left behind.
function magnetLoot(dt, gy) {
  for (const lane of lanes) {
    const r = lane.body;
    for (const o of lane.obs) {
      if (o.type !== 'coin' && o.type !== 'item' && !(o.type === 'health' && r.hp < MAX_HP)) continue;
      o.vy = null; o.grace = 0;
      const k = Math.min(1, 7 * dt);
      o.d += (player.off - o.d) * k; o.y += (r.y - 35 - o.y) * k;
    }
  }
}

// ---------- Drawing ----------
function seg(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function limb(x, y, a, len) { const nx = x + Math.sin(a) * len, ny = y + Math.cos(a) * len; seg(x, y, nx, ny); return [nx, ny]; }

// Angles are measured from straight down; positive = forward (toward incoming obstacles).
// Two-handed overhead smash, by how far through the swing we are (0-1): heave the club up behind the
// head, bring it down hard into the ground in front, a beat there, then haul it back onto the shoulder.
// `reach` is where the arms point (from straight down, + = forward), `a` the club (0 = forward, - = up),
// `lean` the torso (leaning back to wind up, hunched over the hit).
const mix = (a, b, t) => a + (b - a) * t;
const CLUB_REST = [2.5, -2.0, 0.18];  // carried over the shoulder in the front hand
const CLUB_KEYS = { raised: 0.33, impact: 0.46, lift: 0.68 };  // when (0-1 through the swing) each stage ends
function clubPose(k) {
  const at = (t, from, to) => ({ reach: mix(from[0], to[0], t), a: mix(from[1], to[1], t), lean: mix(from[2], to[2], t) });
  const REST = CLUB_REST, RAISED = [3.3, -4.3, -0.1], DOWN = [1.0, 0.95, 0.55], { raised, impact, lift } = CLUB_KEYS;
  if (k < raised) return at(1 - (1 - k / raised) ** 2, REST, RAISED);
  if (k < impact) return { ...at(((k - raised) / (impact - raised)) ** 2, RAISED, DOWN), smear: true };
  if (k < lift) return at(0, DOWN, DOWN);
  const t = Math.min(1, (k - lift) / (1 - lift));
  return at(t * t * (3 - 2 * t), DOWN, REST);
}

// Punch, by how far through it we are (0-1): snap the fist out from the chin, hold a beat, draw it
// back. Every other punch is the rear hand's cross: it starts from further back by the ribs and is
// thrown a touch higher with more weight behind it, so it sweeps a longer path.
// The fist travels in a straight line (offsets from the shoulder) and the arm is solved to follow it.
const PUNCH_GUARD = [10, 8], PUNCH_FROM = [[12, 10], [0, 15]], PUNCH_OUT = [[27, -1], [27, -5]];
const smooth = t => t * t * (3 - 2 * t);
const punchExt = k => k < 0.3 ? 1 - (1 - k / 0.3) ** 3 : k < 0.55 ? 1 : 1 - smooth((k - 0.55) / 0.45);
function punchFist(k, alt) {
  const e = punchExt(k), from = PUNCH_FROM[alt ? 1 : 0], out = PUNCH_OUT[alt ? 1 : 0];
  return [mix(from[0], out[0], e), mix(from[1], out[1], e)];
}
// Shuriken toss: an overhand whip from behind the head, over the top and out along the aim, with the
// wrist lagging until it snaps through. Angles run down from 4 (behind and up) through pi (overhead).
function tossArm(k, aim) {
  const e = 1 - (1 - Math.min(1, k / 0.6)) ** 3, a1 = mix(4.0, aim + 0.25, e);
  return [a1, a1 + 0.9 * (1 - e)];
}
const fistAt = ([a1, a2], sx, sy) => [sx + (Math.sin(a1) + Math.sin(a2)) * 14, sy + (Math.cos(a1) + Math.cos(a2)) * 14];
// A soft white trail along the path a hand took (posAt(k) -> [x, y]) between k0 and k1, thickening
// toward the hand. With `offsets` it's instead thin speed lines running alongside that path.
function fistTrail(posAt, k0, k1, alpha, width = 5, offsets = [0]) {
  if (k1 <= k0) return;
  const pts = [];
  for (let i = 0; i <= 8; i++) pts.push(posAt(k0 + (k1 - k0) * i / 8));
  const [x0, y0] = pts[0], [x1, y1] = pts[8], len = Math.hypot(x1 - x0, y1 - y0) || 1;
  const nx = -(y1 - y0) / len, ny = (x1 - x0) / len;
  ctx.save(); ctx.strokeStyle = '#ffffff'; ctx.lineCap = 'round';
  for (const o of offsets)
    for (let i = 1; i <= 8; i++) {
      ctx.globalAlpha = alpha * i / 8; ctx.lineWidth = 1 + width * i / 8;
      seg(pts[i - 1][0] + nx * o, pts[i - 1][1] + ny * o, pts[i][0] + nx * o, pts[i][1] + ny * o);
    }
  ctx.restore();
}

// Two-bone reach: the shoulder and elbow angles that put a hand at (tx, ty), elbow bent forward/down.
function reachFor(sx, sy, tx, ty, len = 14) {
  const dx = tx - sx, dy = ty - sy, d = Math.min(Math.hypot(dx, dy), len * 2 - 0.01);
  const base = Math.atan2(dx, dy), bend = Math.acos(d / (len * 2));
  const pick = s => { const a1 = base + s * bend; return [a1, a1 - s * bend * 2]; };
  const lowFwd = ([a1]) => Math.sin(a1) * 0.3 + Math.cos(a1);
  const [p, q] = [pick(-1), pick(1)];
  return lowFwd(p) >= lowFwd(q) ? p : q;
}

function drawStick(x, gy, pose) {
  // `club` (or `grip`, for a gun) puts both hands on a held weapon: `reach` is where the arms point,
  // `a` the weapon's angle, `len` how far out the front hand is and `hold` how far up it the other is
  const { phase, mode, punch = -1, alt = false, toss = -1, aim = Math.PI / 2, club = null, grip = null,
          windup = false, throwing = false, deflect = -1 } = pose;
  const two = club || grip, lean = pose.lean !== undefined ? pose.lean : two ? two.lean : 0.18;
  let { tilt = 0 } = pose;
  if (punch >= 0) tilt += punchExt(punch) * (alt ? 0.14 : 0.06);  // the cross rolls the shoulder in
  if (toss >= 0) tilt += Math.sin(Math.PI * Math.min(1, toss)) * 0.2;  // lean into the throw
  ctx.strokeStyle = INK; ctx.fillStyle = INK; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 6;
  let hipY = gy - 34, torsoA = lean + tilt, legs, arms;
  if (mode === 'slide') {
    hipY = gy - 9; torsoA = -1.15;
    legs = [[1.45, 1.5], [1.25, 1.6]];
    arms = [[-2.2, -2.5], [-1.9, -2.3]];
  } else if (mode === 'stand') {
    legs = [[0.32, 0.22], [-0.3, -0.18]];
    arms = [[0.4, 1.3], [-0.3, 0.4]];
    hipY += Math.sin(phase) * 1.2;  // idle breathing
  } else if (mode === 'jump') {
    legs = [[1.0, -0.4], [0.5, -0.7]];
    arms = [[2.6, 2.2], [-2.4, -2.9]];
  } else {
    const s = Math.sin(phase);
    legs = [0, Math.PI].map(o => {
      const p = phase + o, a = Math.sin(p) * 0.85;
      return [a, a - 0.25 - Math.max(0, Math.cos(p)) * 1.3];
    });
    arms = [[-s * 0.9, -s * 0.9 + 1.4], [s * 0.9, s * 0.9 + 1.4]];
    hipY += Math.abs(Math.cos(phase)) * -3;
  }
  if (toss >= 0) arms[0] = tossArm(toss, aim), arms[1] = [-0.7, -0.3];  // off arm swings back for balance
  if (windup) arms[0] = [-2.5, -1.7];  // throwing arm cocked back behind the head
  if (throwing) arms[0] = [2.1, 1.75], arms[1] = [-0.9, 0.2];  // overhand whip, arm high and forward
  if (deflect >= 0) {  // backhand swat sweeping up from low-front to overhead
    const k = Math.min(1, deflect * 1.6);
    arms[0] = [0.5 + k * 2.3, 1.0 + k * 1.9]; arms[1] = [-0.8, 0.3];
  }

  for (const [a1, a2] of legs) { const k = limb(x, hipY, a1, 17); limb(k[0], k[1], a2, 18); }
  const nx = x + Math.sin(Math.PI - torsoA) * 26, ny = hipY + Math.cos(Math.PI - torsoA) * 26;
  seg(x, hipY, nx, ny);
  const shX = x + (nx - x) * 0.85, shY = hipY + (ny - hipY) * 0.85;
  let hand = null;
  const reachLen = two && two.len || 23, hold = two && two.hold || 7;
  if (punch >= 0) {  // punching hand follows its fist; the other stays up at the chin
    const [fx, fy] = punchFist(punch, alt);
    arms = [reachFor(shX, shY, shX + fx, shY + fy), reachFor(shX, shY, shX + PUNCH_GUARD[0], shY + PUNCH_GUARD[1])];
  }
  if (two) {  // swinging: both hands on the handle, one a little further up it; carrying: just the front one
    const gx = shX + Math.sin(two.reach) * reachLen, gyy = shY + Math.cos(two.reach) * reachLen;
    arms = [reachFor(shX, shY, gx, gyy),
            two.carry ? arms[1] : reachFor(shX, shY, gx + Math.cos(two.a) * hold, gyy + Math.sin(two.a) * hold)];
  }
  // the throwing hand drags a soft arc behind it, drawn behind the arm
  if (toss >= 0) fistTrail(k => fistAt(tossArm(k, aim), shX, shY), Math.max(0, toss - 0.35), Math.min(toss, 0.6), 0.5);
  for (const [a1, a2] of arms) { const e = limb(shX, shY, a1, 14); const h = limb(e[0], e[1], a2, 14); hand = hand || h; }
