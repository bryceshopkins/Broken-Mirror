  if (two) hand = [shX + Math.sin(two.reach) * reachLen, shY + Math.cos(two.reach) * reachLen, shX, shY];
  ctx.beginPath(); ctx.arc(nx + Math.sin(Math.PI - torsoA) * 10, ny + Math.cos(Math.PI - torsoA) * 10, 10, 0, Math.PI * 2); ctx.fill();
  if (punch >= 0) {  // a solid fist with speed lines riding along behind it, then a little pop at full reach
    const at = k => { const [fx, fy] = punchFist(k, alt); return [shX + fx, shY + fy]; }, f = at(punch);
    ctx.beginPath(); ctx.arc(f[0], f[1], 4.5, 0, Math.PI * 2); ctx.fill();
    fistTrail(at, Math.max(0, punch - 0.3), Math.min(punch, 0.3) - 0.03, 0.7, 1.5, [-6, 6]);
    const t = (punch - 0.26) / 0.25;
    if (t > 0 && t < 1) {
      ctx.save(); ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = (1 - t) * 0.45; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(f[0] + 4, f[1], 5 + t * 10, -1.1, 1.1); ctx.stroke(); ctx.restore();
    }
  }
  return hand;  // where the front hand ended up, for holding things
}

function drawEnemy(x, gy, o) {
  if (o.kind === 'brute') return drawBrute(x, gy, o);
  const thrower = o.kind === 'thrower';
  ctx.save(); ctx.translate(2 * x, 0); ctx.scale(-1, 1);  // face the player
  // Thrower animation: settle, lean back to cock the arm, then lunge forward with an overhand whip.
  let pose = { phase: o.t * 7, mode: 'run', lean: 0.05 };
  if (thrower) {
    pose = { phase: o.t * 3, mode: 'stand', lean: 0.02 };
    if (o.windT > 0) pose = { ...pose, windup: true, lean: -0.1 - 0.25 * (1 - o.windT / STAR.windup) };
    else if (o.relT > 0) pose = { ...pose, throwing: true, lean: 0.15 + 0.35 * (o.relT / THROW_REL_T) };
  }
  drawStick(x, gy, pose);
  if (thrower && o.relT > 0) {  // swoosh trailing the throwing hand
    ctx.save(); ctx.strokeStyle = '#ff3b3b'; ctx.lineCap = 'round';
    ctx.globalAlpha = o.relT / THROW_REL_T; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, gy - 60, 30, -2.2, -0.2); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();
  if (thrower) {  // red headband with tails fluttering behind
    ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    const wave = Math.sin(o.t * 10) * 3;
    seg(x - 9, gy - 72, x + 9, gy - 72);
    seg(x + 8, gy - 72, x + 22, gy - 70 + wave); seg(x + 8, gy - 71, x + 19, gy - 64 - wave);
  }
  if (thrower && o.windT > 0) {
    // telegraph: a glowing star in the cocked hand and a red "!" over the head
    const k = 1 - o.windT / STAR.windup;
    ctx.save(); ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 10 + k * 14;
    drawShuriken(x + 12, gy - 86, o.t * 10, '#ff3b3b', false, 1.2);
    ctx.restore();
    const s = 0.7 + Math.min(1, k * 3) * 0.3;
    ctx.fillStyle = '#ff3b3b';
    ctx.fillRect(x - 3 * s, gy - 122 * 1 + (1 - s) * 10, 6 * s, 18 * s);
    ctx.beginPath(); ctx.arc(x, gy - 96, 3.5 * s, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = '#ff3b3b';
  ctx.beginPath(); ctx.arc(x - 4, gy - 76, 2.5, 0, Math.PI * 2); ctx.fill();
}

// Four-point throwing star. `tint` marks whose it is (red: enemy, accent: yours, white: pickup).
function drawShuriken(x, y, rot, tint, glow = false, scale = 1, ink = INK) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(scale, scale);
  if (glow) { ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12; }
  ctx.fillStyle = ink; ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2, r = i % 2 ? 3.5 : 11;
    ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
  }
  ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = tint; ctx.beginPath(); ctx.arc(0, 0, 2.5, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

// The Obliterator: a hulking triple-barrel laser cannon. Drawn from its grip at (x, y), pointing along `a`;
// `flash` (0-1) adds a muzzle flash. Returns where the muzzle ended up.
function drawObliterator(x, y, a, s, ink = INK, flash = 0) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  ctx.fillStyle = ink;
  ctx.beginPath(); ctx.moveTo(-34, -10); ctx.lineTo(-14, -14); ctx.lineTo(-14, -2); ctx.lineTo(-30, 3); ctx.closePath(); ctx.fill();  // stock
  ctx.beginPath(); ctx.roundRect(-14, -17, 44, 16, 4); ctx.fill();                                   // body
  ctx.fillRect(-4, -23, 18, 6); ctx.fillRect(2, -26, 6, 4);                                          // sight
  ctx.beginPath(); ctx.moveTo(-6, -2); ctx.lineTo(2, -2); ctx.lineTo(-1, 10); ctx.lineTo(-9, 10); ctx.closePath(); ctx.fill();  // grip
  ctx.fillRect(10, -2, 6, 7);                                                                         // fore grip
  ctx.beginPath(); ctx.roundRect(29, -16, 9, 14, 2); ctx.fill();                                     // barrel housing
  for (const by of [-15, -10.5, -6]) ctx.fillRect(37, by, 26, 3.5);                                  // three barrels
  ctx.fillStyle = '#ff2b6a'; ctx.shadowColor = '#ff2b6a'; ctx.shadowBlur = 10;
  ctx.fillRect(-10, -11, 36, 3); ctx.fillRect(31, -12, 5, 6);                                        // glowing core
  for (const by of [-15, -10.5, -6]) ctx.fillRect(61, by, 3, 3.5);                                   // hot barrel tips
  if (flash > 0) {
    ctx.globalAlpha = flash; ctx.fillStyle = '#ffffff'; ctx.shadowBlur = 20;
    ctx.beginPath(); ctx.moveTo(64, -18); ctx.lineTo(84, -9); ctx.lineTo(64, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff2b6a'; ctx.beginPath(); ctx.arc(66, -9, 9, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  return [x + (Math.cos(a) * 64 - Math.sin(a) * -9) * s, y + (Math.sin(a) * 64 + Math.cos(a) * -9) * s];
}

// Spiked club: handle out along angle `a` (0 = forward, negative = up), heavy studded head at the end.
function drawClub(x, y, a, s, color = INK) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineCap = 'round';
  ctx.lineWidth = 5; seg(-4, 0, 26, 0);
  ctx.beginPath(); ctx.ellipse(38, 0, 15, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    const sx = 27 + i * 6.5;
    ctx.moveTo(sx, -6); ctx.lineTo(sx + 3, -14); ctx.lineTo(sx + 6, -6);
    ctx.moveTo(sx, 6); ctx.lineTo(sx + 3, 14); ctx.lineTo(sx + 6, 6);
  }
  ctx.moveTo(51, -4); ctx.lineTo(60, 0); ctx.lineTo(51, 4);
  ctx.fill();
  ctx.restore();
}

// Battle axe: handle out along angle `a` (0 = forward, negative = up), a double-bitted head at the end.
function drawAxe(x, y, a, s, color = INK) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(s, s);
  ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.lineWidth = 5; seg(-4, 0, 54, 0);
  ctx.beginPath();
  for (const k of [-1, 1]) {  // a flared blade on each side, the cutting edge curving out
    ctx.moveTo(38, -3 * k); ctx.lineTo(46, -3 * k); ctx.lineTo(56, -22 * k);
    ctx.quadraticCurveTo(42, -32 * k, 28, -22 * k); ctx.closePath();
  }
  ctx.moveTo(52, -3); ctx.lineTo(61, 0); ctx.lineTo(52, 3);
  ctx.fill();
  ctx.restore();
}
// the two-handed heavy weapons (anim: 'club') share a pose and differ only in how they're drawn
const drawMelee = (key, x, y, a, s, color) => (key === 'axe' ? drawAxe : drawClub)(x, y, a, s, color);

// A brute: a squat, heavy stick figure with a huge axe, drawn in lane space facing the runner.
// The axe rests back over his shoulder, heaves further back to wind up, then comes over the top.
function drawBrute(x, gy, o) {
  const ink = o.flashT > 0 ? '#ffffff' : INK;
  const winding = o.windT > 0, swinging = o.swingT > 0, staggered = o.kb > 30;
  const wk = winding ? 1 - o.windT / BRUTE.windup : 0;
  ctx.save(); ctx.translate(x, gy); ctx.scale(-1, 1);  // local: +x faces the runner, 0 is his feet
  ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const walk = winding || swinging || o.recT > 0 || staggered ? 0 : Math.sin(o.t * 5);
  ctx.lineWidth = 11;
  seg(-9, -42, -10 + walk * 9, -3); seg(9, -42, 10 - walk * 9, -3);
  // lean back into the windup, forward through the chop, and reel when knocked back
  const lean = winding ? -0.14 * wk : swinging ? 0.14 : staggered ? -0.16 : 0;
  ctx.translate(0, -42); ctx.rotate(lean); ctx.translate(0, 42);
  const bob = Math.abs(walk) * -2;
  ctx.beginPath(); ctx.ellipse(0, -72 + bob, 26, 31, 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 9; seg(-12, -88 + bob, -20, -60 + bob);
  ctx.beginPath(); ctx.arc(9, -108 + bob, 14, 0, Math.PI * 2); ctx.fill();
  ctx.save(); ctx.fillStyle = '#ff3b3b';
  if (winding) { ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 12; }
  ctx.beginPath(); ctx.arc(15, -110 + bob, winding ? 3.4 : 2.6, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  let a = -2.2 + walk * 0.05;
  if (winding) a = -2.2 - 0.7 * wk + Math.sin(time * 40) * 0.05 * wk;
  else if (swinging) a = -2.9 + (BRUTE.endA + 2.9) * easeOut(1 - o.swingT / BRUTE.swing);
  else if (o.recT > 0) a = BRUTE.endA + (-2.2 - BRUTE.endA) * (1 - o.recT / BRUTE.recover);
  const sx = 8, sy = -90 + bob, hx = sx + Math.cos(a) * 20, hy = sy + Math.sin(a) * 20;
  if (winding) {  // ghost of the chop: a dashed arc tracing where the axe head is about to go
    ctx.save(); ctx.strokeStyle = '#ff5a4a'; ctx.globalAlpha = 0.15 + 0.45 * wk; ctx.lineWidth = 2 + 2 * wk;
    ctx.setLineDash([7, 7]); ctx.lineDashOffset = -time * 30;
    ctx.beginPath(); ctx.arc(sx, sy, 112, -2.9, -2.9 + (BRUTE.endA + 2.9) * Math.min(1, wk * 1.4)); ctx.stroke(); ctx.restore();
  }
  if (swinging) {  // heavy smear behind the axe head
    ctx.save(); ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = 0.55; ctx.lineWidth = 18;
    ctx.beginPath(); ctx.arc(sx, sy, 105, -2.9, a); ctx.stroke(); ctx.restore();
  }
  ctx.lineWidth = 9; seg(sx, sy, hx, hy);
  ctx.save();
  if (winding) { ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 8 + 16 * wk; }
  drawAxe(hx, hy, a, 1.75, ink);
  ctx.restore();
  ctx.restore();
  if (winding) {  // telegraph: a red "!" over his head, like the throwers
    const s = 0.7 + Math.min(1, wk * 3) * 0.3;
    ctx.fillStyle = '#ff3b3b';
    ctx.fillRect(x - 3 * s, gy - 168 + (1 - s) * 10, 6 * s, 18 * s);
    ctx.beginPath(); ctx.arc(x, gy - 142, 3.5 * s, 0, Math.PI * 2); ctx.fill();
  }
  if (o.hp < o.maxHp) {  // a little health bar once he's been hit
    const w = 46, bx = x - w / 2, by = gy - 132;
    ctx.fillStyle = INK; ctx.fillRect(bx - 2, by - 2, w + 4, 8);
    ctx.fillStyle = '#3a1016'; ctx.fillRect(bx, by, w, 4);
    ctx.fillStyle = '#ff3b3b'; ctx.fillRect(bx, by, w * Math.max(0, o.hp / o.maxHp), 4);
  }
}

// The boss: a hulking horned brute, drawn in screen space across the seam, facing boss.f.
function drawBoss(b, gy) {
  const ink = b.flashT > 0 ? '#ffffff' : INK;
  const dying = b.state === 'dying';
  ctx.save();
  ctx.translate(b.x, gy + b.y); ctx.scale(b.f * BOSS.scale, BOSS.scale);  // local: +x is the way he's facing, 0 is his feet
  if (b.state === 'crouch') ctx.translate(0, 10), ctx.scale(1.06, 0.92);
  if (b.state === 'rageWindup') { const k = Math.min(1, b.t / BOSS.rage.windup); ctx.translate(-6 * k, 8 * k); ctx.scale(1 + 0.05 * k, 1 - 0.07 * k); }
  if (dying) ctx.translate((Math.random() - 0.5) * 6, 0);
  ctx.strokeStyle = ink; ctx.fillStyle = ink; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  // legs (stomping while he walks, tucked in a leap)
  const walk = b.state === 'walk' ? Math.sin(time * 9) : 0;
  ctx.lineWidth = 18;
  if (b.state === 'leap') { seg(-14, -70, 4, -30); seg(14, -70, 30, -36); }
  else { seg(-16, -70, -18 + walk * 14, -2); seg(16, -70, 18 - walk * 14, -2); }
  // body, back arm, head and horns
  const bob = Math.abs(walk) * -4;
  ctx.beginPath(); ctx.ellipse(0, -115 + bob, 46, 52, 0.08, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 15; seg(-22, -140 + bob, -36, -92 + bob);
  // head: thrown back with the jaw open while he roars
  const roar = b.state === 'roar';
  ctx.save();
  if (roar) { ctx.translate(18, -150 + bob); ctx.rotate(-0.35 + Math.sin(time * 30) * 0.05); ctx.translate(-18, 150 - bob); }
  ctx.beginPath(); ctx.arc(18, -172 + bob, 25, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(2, -188 + bob); ctx.lineTo(-10, -214 + bob); ctx.lineTo(12, -194 + bob);
  ctx.moveTo(26, -194 + bob); ctx.lineTo(40, -216 + bob); ctx.lineTo(38, -186 + bob);
  ctx.fill();
  // eyes: glowing red, brighter while winding up; X'd out when he goes down
  ctx.strokeStyle = '#ff3b3b'; ctx.fillStyle = '#ff3b3b';
  if (dying) { ctx.lineWidth = 3; seg(24, -180 + bob, 34, -170 + bob); seg(34, -180 + bob, 24, -170 + bob); }
  else {
    ctx.save(); if (b.state === 'windup' || b.state === 'rageWindup' || roar) { ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 14; }
    ctx.beginPath(); ctx.arc(30, -176 + bob, roar ? 5 : 4, 0, Math.PI * 2); ctx.fill(); ctx.restore();
  }
  if (roar) { ctx.beginPath(); ctx.ellipse(36, -158 + bob, 8, 6, 0.3, 0, Math.PI * 2); ctx.fill(); }  // open jaw
  ctx.restore();
  if (roar) {  // shockwave rings rolling off the roar
    ctx.save(); ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 4;
    for (let i = 0; i < 3; i++) {
      const k = (b.t * 2.2 + i / 3) % 1;
      ctx.globalAlpha = 0.6 * (1 - k);
      ctx.beginPath(); ctx.arc(34, -165 + bob, 30 + k * 110, -0.9, 0.9); ctx.stroke();
    }
    ctx.restore();
  }
  // club arm: angle 0 = forward, negative = raised. A swing ends at b.endA, aimed at its zone.
  const swingK = d => Math.min(1, b.t / d);
  let a = -2.3;
  if (b.state === 'windup') a = -2.3 - 0.6 * swingK(BOSS.windup) + Math.sin(time * 40) * 0.04;
  else if (b.state === 'rageWindup') a = -2.3 - 0.6 * swingK(BOSS.rage.windup) + Math.sin(time * 50) * 0.05;
  else if (roar) a = -2.5 + Math.sin(time * 30) * 0.1;
  else if (b.state === 'swing') a = -2.9 + (b.endA + 2.9) * swingK(BOSS.swing);
  else if (b.state === 'rageSwing') a = -2.9 + (b.endA + 2.9) * swingK(BOSS.rage.swing);
  else if (b.state === 'rageBack') a = b.endA + (-2.3 - b.endA) * swingK(BOSS.rage.back);
  else if (b.state === 'recover') a = b.endA + (-2.3 - b.endA) * swingK(BOSS.recover);
  else if (b.state === 'crouch' || b.state === 'leap') a = -2.7;
  else if (dying) a = 0.9;
  const sx = 14, sy = -142 + bob, hx = sx + Math.cos(a) * 40, hy = sy + Math.sin(a) * 40;
  if (SWINGS.includes(b.state)) {  // heavy smear following the club head (red-hot when he's raging)
    ctx.save(); ctx.strokeStyle = b.state === 'swing' ? '#ffffff' : '#ff8a7a'; ctx.globalAlpha = 0.55; ctx.lineWidth = 22;
    ctx.beginPath(); ctx.arc(sx, sy, 125, -2.9, a); ctx.stroke(); ctx.restore();
  }
  ctx.strokeStyle = ink; ctx.lineWidth = 15; seg(sx, sy, hx, hy);
  ctx.save();
  if (b.state === 'windup') { ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 10 + 20 * Math.min(1, b.t / BOSS.windup); }
  drawClub(hx, hy, a, 2.0, ink);
  ctx.restore();
  ctx.restore();
}

// Boss shockwave: a churning wall of dark smoke with a red-hot core, plus a scorched strip on the
// floor showing the whole path it will travel, ending in a marker where it dies out.
function drawWave(o, gy) {
  const left = Math.max(0, (o.d - o.end) / BOSS.waveRange);  // 1 at the start, 0 where it stops
  ctx.save();
  // the path ahead: a red glow line along the floor up to the end marker
  ctx.globalAlpha = 0.55;
  const g = ctx.createLinearGradient(o.d, 0, o.end, 0);
  g.addColorStop(0, 'rgba(255,59,59,0.9)'); g.addColorStop(1, 'rgba(255,59,59,0.25)');
  ctx.fillStyle = g; ctx.fillRect(o.end, gy - 3, o.d - o.end, 4);
  ctx.globalAlpha = 0.8; ctx.strokeStyle = '#ff3b3b'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  seg(o.end, gy - 14, o.end, gy + 4);  // "it stops here"
  ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.moveTo(o.end - 6, gy - 16); ctx.lineTo(o.end + 6, gy - 16); ctx.lineTo(o.end, gy - 9); ctx.fill();
  // the wave itself
  const a = Math.min(1, left * 4);
  const hgt = BOSS.waveH + 22;
  ctx.globalAlpha = a; ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 18; ctx.fillStyle = '#ff5a3a';
  ctx.beginPath(); ctx.moveTo(o.d - 22, gy); ctx.quadraticCurveTo(o.d - 6, gy - hgt * 0.9, o.d + 14, gy); ctx.fill();
  ctx.shadowBlur = 0;
  for (let i = 0; i < 6; i++) {  // smoke puffs churning behind the front
    const px = o.d + 6 + i * 11 + Math.sin(o.t * 12 + i) * 3, py = gy - 8 - (i % 3) * 9 - Math.abs(Math.sin(o.t * 9 + i * 1.7)) * 10;
    ctx.globalAlpha = a * (0.85 - i * 0.11);
    ctx.fillStyle = i % 2 ? '#2a2230' : '#3c3240';
    ctx.beginPath(); ctx.arc(px, py, 13 - i, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
  if (Math.random() < 0.4) particles.push({ x: o.d, y: gy - 6, vx: 60 + Math.random() * 80, vy: -120 - Math.random() * 160,
    life: 0.4, side: o.side, r: 3, rot: 0, color: '#ff8a5a' });
}

// Danger marking for an incoming club hit: a soft red glow over the area with claw-like slash
// marks scratching in and embers drifting up. It builds as the hit gets closer.
function drawDangerZone(z, gy) {
  const k = Math.max(0, Math.min(1, (time - z.t0) / (z.hitAt - z.t0)));
  const w = z.d1 - z.d0, h = z.hi - z.lo, cx = (z.d0 + z.d1) / 2, cy = gy - (z.lo + z.hi) / 2;
  const pulse = 0.8 + 0.2 * Math.sin(time * (10 + k * 14));
  ctx.save();
  // glow
  ctx.save(); ctx.translate(cx, cy); ctx.scale(w * 0.62, h * 0.62);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
  g.addColorStop(0, `rgba(255,59,59,${(0.18 + 0.32 * k) * pulse})`);
  g.addColorStop(0.65, `rgba(255,59,59,${(0.08 + 0.16 * k) * pulse})`);
  g.addColorStop(1, 'rgba(255,59,59,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  // ghost of the swing: three arcs tracing the club head's path from raised to the hit, drawing
  // themselves further along as the hit gets closer, with an arrowhead once the path is complete
  ctx.strokeStyle = '#ff5a4a'; ctx.lineCap = 'round'; ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 8;
  const pt = (a, R) => [z.sd - Math.cos(a) * R, gy - z.sh + Math.sin(a) * R];
  const radii = [82, 104, 126].map(r => r * BOSS.scale * 1.25);
  for (let i = 0; i < 3; i++) {
    const p = Math.max(0, Math.min(1, k * 1.4 - i * 0.12));
    if (!p) continue;
    const aEnd = z.a0 + (z.a1 - z.a0) * p;
    // ghostly: dashed, faint, and fading in along its length, so it reads as a preview, not a hitbox
    const base = (0.18 + 0.32 * k) * (i === 1 ? 1 : 0.6);
    ctx.lineWidth = (i === 1 ? 2.5 : 1.5) + 1.5 * k; ctx.setLineDash([7, 7]); ctx.lineDashOffset = -time * 30;
    for (let j = 0; j < 24; j++) {
      const [x0, y0] = pt(z.a0 + (aEnd - z.a0) * (j / 24), radii[i]), [x1, y1] = pt(z.a0 + (aEnd - z.a0) * ((j + 1) / 24), radii[i]);
      ctx.globalAlpha = base * (j / 24);
      ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); ctx.stroke();
    }
    ctx.setLineDash([]); ctx.globalAlpha = base;
    if (i === 1 && p >= 1) {  // arrowhead showing which way it's coming
      const [x1, y1] = pt(z.a1, radii[i]), [x0, y0] = pt(z.a1 - 0.12, radii[i]);
      const ang = Math.atan2(y1 - y0, x1 - x0);
      ctx.fillStyle = '#ff5a4a'; ctx.beginPath();
      ctx.moveTo(x1 + Math.cos(ang) * 10, y1 + Math.sin(ang) * 10);
      ctx.lineTo(x1 + Math.cos(ang + 2.4) * 10, y1 + Math.sin(ang + 2.4) * 10);
      ctx.lineTo(x1 + Math.cos(ang - 2.4) * 10, y1 + Math.sin(ang - 2.4) * 10);
      ctx.fill();
    }
  }
  // embers
  ctx.shadowBlur = 0; ctx.fillStyle = '#ff8a7a';
  for (let i = 0; i < 7; i++) {
    const ex = z.d0 + ((i * 53 + time * 30) % w), ey = gy - z.lo - ((time * 70 + i * 31) % h);
    ctx.globalAlpha = (0.3 + 0.5 * k) * (1 - ((time * 70 + i * 31) % h) / h);
    ctx.fillRect(ex, ey, 3, 3);
  }
  ctx.restore();
}

// A flying star with a speed streak and fading after-images so you can actually follow it.
// Enemy stars are bigger and glow red; yours glow in your side's color; deflected ones burn white.
function drawStar(o, gy, sky) {
  const vx = o.friendly ? o.vd : -(speed + STAR.enemySpeed), vy = o.friendly ? o.vy : 0;
  const len = Math.hypot(vx, vy) || 1, ux = vx / len, uy = vy / len;
  const tint = o.deflected ? '#ffffff' : o.friendly ? sky.accent : '#ff3b3b';
  const scale = o.friendly ? 1.1 : 1.4, x = o.d, y = gy + o.y;
  ctx.save();
  ctx.strokeStyle = tint; ctx.lineCap = 'round';
  ctx.globalAlpha = 0.55; ctx.lineWidth = 4; seg(x, y, x - ux * 60, y - uy * 60);
  ctx.globalAlpha = 0.3; ctx.lineWidth = 2; seg(x, y - 6, x - ux * 40, y - uy * 40 - 6); seg(x, y + 6, x - ux * 40, y - uy * 40 + 6);
  for (let k = 3; k >= 1; k--) {
    ctx.globalAlpha = 0.25 * (1 - k / 4);
    drawShuriken(x - ux * k * 14, y - uy * k * 14, o.t * 18 - k * 0.5, tint, false, scale * (1 - k * 0.1));
  }
  ctx.globalAlpha = 1; ctx.shadowColor = tint; ctx.shadowBlur = 14;
  drawShuriken(x, y, o.t * 18, tint, false, scale);
  ctx.restore();
}

// Gronk's lair, in lane space, from its entrance x0 to its way out x1: dark inside, a jagged roof
// with stalactites, torches on the walls and old bones on the floor. Everything is placed relative
// to the entrance, so it all scrolls together and stays put while the runners are stopped.
function drawLair(x0, x1, gy, half) {
  if (x0 > half + 40 || x1 < -60) return;
  const jag = i => Math.abs(Math.sin(i * 12.9898) * 43758.5453) % 1;  // fixed pseudo-random 0-1
  const end = Math.min(x1, half + 60);
  ctx.save();
  ctx.fillStyle = 'rgba(8,6,12,0.55)'; ctx.fillRect(x0, 0, end - x0 + 1, gy);
  // the overhanging lip of a cave mouth at x, with the inside on the `dir` side
  const lip = (x, dir) => {
    ctx.beginPath(); ctx.moveTo(x - 40 * dir, 0);
    for (const [dx, k] of [[-40, 0.18], [-18, 0.42], [-4, 0.33], [10, 0.5], [26, 0.2], [26, 0]]) ctx.lineTo(x + dx * dir, gy * k);
    ctx.closePath(); ctx.fill();
  };
  ctx.fillStyle = INK;
  lip(x0, 1);
  if (x1 < half + 60) lip(x1, -1);
  // the roof: a thick band of rock with stalactites between the two mouths
  const from = Math.max(x0 + 26, -60), to = Math.min(x1 - 26, half + 60);
  if (to > from) {
    ctx.beginPath(); ctx.moveTo(from, 0); ctx.lineTo(from, 34);
    for (let i = Math.max(0, Math.ceil((from - x0 - 52) / 46)), x = x0 + 40 + i * 46; x < to - 12; i++, x += 46) {
      const top = 34 + jag(i) * 12;
      ctx.lineTo(x - 12, top); ctx.lineTo(x, top + 16 + jag(i + 7) * 36); ctx.lineTo(x + 12, top);
    }
    ctx.lineTo(to, 34); ctx.lineTo(to, 0); ctx.closePath(); ctx.fill();
  }
  // torches on the wall, flickering: one just inside each way in and out, one in the middle
  for (const tx of [x0 + 34, x0 + 150, x1 - 34]) {
    if (tx < -40 || tx > Math.min(x1, half + 40)) continue;
    const ty = gy - 118, fl = Math.sin(time * 23 + tx) * 0.15 + Math.sin(time * 37 + tx) * 0.1;
    const glow = ctx.createRadialGradient(tx, ty - 10, 0, tx, ty - 10, 90);
    glow.addColorStop(0, 'rgba(255,160,60,0.35)'); glow.addColorStop(1, 'rgba(255,160,60,0)');
    ctx.fillStyle = glow; ctx.fillRect(tx - 90, ty - 100, 180, 180);
    ctx.strokeStyle = INK; ctx.lineWidth = 5; ctx.lineCap = 'round'; seg(tx - 6, ty + 26, tx, ty);
    ctx.fillStyle = '#ff8a2a'; ctx.beginPath(); ctx.ellipse(tx, ty - 9, 7, 13 * (1 + fl), 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.ellipse(tx, ty - 5, 3.5, 7 * (1 + fl), 0, 0, Math.PI * 2); ctx.fill();
  }
  // old bones and skulls lying on the floor
  ctx.strokeStyle = ctx.fillStyle = '#d9cfc0'; ctx.globalAlpha = 0.75; ctx.lineWidth = 3;
  for (const [dx, skull] of [[150, true], [255, false], [390, false], [520, true]]) {
    const bx = x0 + dx;
    if (bx > Math.min(x1 - 20, half)) continue;
    if (skull) {
      ctx.beginPath(); ctx.arc(bx, gy - 7, 7, 0, Math.PI * 2); ctx.fill(); ctx.fillRect(bx - 4, gy - 3, 8, 4);
      ctx.fillStyle = INK; ctx.fillRect(bx - 4, gy - 9, 3, 3); ctx.fillRect(bx + 1, gy - 9, 3, 3); ctx.fillStyle = '#d9cfc0';
    } else { seg(bx - 12, gy - 2, bx + 12, gy - 6); seg(bx - 8, gy - 8, bx + 8, gy - 1); }
  }
  ctx.restore();
}

function drawLane(lane, sky) {
  const gy = groundY(), half = W / 2;
  ctx.save();
  ctx.beginPath(); ctx.rect(lane.side < 0 ? 0 : half, 0, half, H); ctx.clip();
  // lane-space: x = distance from the outer edge, so both runners face the center seam
  if (lane.side > 0) { ctx.translate(W, 0); ctx.scale(-1, 1); }

  // Distant hills
  ctx.fillStyle = sky.hill;
  for (const h of lane.hills) { ctx.beginPath(); ctx.arc(h.x, gy + 30, h.r, Math.PI, 0); ctx.fill(); }
  // Ground
  ctx.fillStyle = INK; ctx.fillRect(0, gy, half, H - gy);
  ctx.fillStyle = 'rgba(255,255,255,0.06)';
  for (let x = -(distance % 60); x < half; x += 60) ctx.fillRect(x, gy + 14, 26, 3);
  if (boss) drawLair(boss.gateD, boss.exitD, gy, half);

  // terrain first, so everything else is drawn on top of it
  const terrain = o => o.type === 'tunnel' || o.type === 'ledge';
  for (const o of [...lane.obs.filter(terrain), ...lane.obs.filter(o => !terrain(o))]) {
    if (o.dead) continue;
    ctx.fillStyle = INK;
    const by = gy + o.y;  // this obstacle's floor level (raised when it sits on a ledge)
    if (o.type === 'tunnel') {
      const x0 = o.d - o.len / 2, s = x0 + stairsStart(o);
      ctx.fillStyle = sky.cave; ctx.fillRect(x0, gy, o.len, o.depth);   // hollow
      ctx.fillStyle = INK;
      for (let k = 1; k < TUNNEL.steps; k++)                            // stairs
        ctx.fillRect(s + k * TUNNEL.stepW, gy + o.depth - k * STEP_H, TUNNEL.stepW + 1, k * STEP_H + 1);
      ctx.fillStyle = 'rgba(255,255,255,0.18)';
      for (let k = 1; k < TUNNEL.steps; k++) ctx.fillRect(s + k * TUNNEL.stepW, gy + o.depth - k * STEP_H, TUNNEL.stepW, 2);
      // roof, styled like the floating platforms since it works the same way (pass-through from below)
      const rx = x0 + o.gap, rw = roofEnd(o) - o.gap;
      ctx.fillStyle = INK; ctx.fillRect(rx, gy, rw, TUNNEL.roof);
      ctx.fillStyle = sky.accent; ctx.fillRect(rx, gy, rw, 3);
      ctx.fillStyle = 'rgba(11,10,15,0.35)'; ctx.fillRect(rx + 8, gy + TUNNEL.roof, rw - 16, 6);
    }
    else if (o.type === 'ledge') {
      ctx.fillRect(o.d - o.len / 2, gy - o.h, o.len, o.h + 1);
      ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(o.d - o.len / 2, gy - o.h, o.len, 3);
    }
    else if (o.type === 'block') {
      ctx.fillRect(o.d - BLOCK.half, by - BLOCK.h, BLOCK.half * 2, BLOCK.h);
      ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(o.d - BLOCK.half, by - BLOCK.h, BLOCK.half * 2, 3);
    }
    else if (o.type === 'spike') {
      ctx.beginPath();
      for (let i = 0; i < 3; i++) { const x = o.d - 16 + i * 11; ctx.moveTo(x - 1, by); ctx.lineTo(x + 5, by - 22); ctx.lineTo(x + 11, by); }
      ctx.fill();
      ctx.fillStyle = sky.accent;
      for (let i = 0; i < 3; i++) ctx.fillRect(o.d - 12 + i * 11, by - 22, 2, 4);
    }
    else if (o.type === 'health') {  // a glowing green orb with a white cross, bigger for bigger heals
      const x = o.d, y = gy + o.y + Math.sin(o.t * 3) * 2, rad = o.heal >= 20 ? 13 : 10;
      ctx.save(); ctx.shadowColor = '#5bd16a'; ctx.shadowBlur = 14 + Math.sin(o.t * 5) * 4;
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x, y, rad + 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#5bd16a'; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0; ctx.fillStyle = '#ffffff';
      ctx.fillRect(x - rad * 0.55, y - rad * 0.18, rad * 1.1, rad * 0.36); ctx.fillRect(x - rad * 0.18, y - rad * 0.55, rad * 0.36, rad * 1.1);
      ctx.restore();
    }
    else if (o.type === 'coin') {
      const s = Math.abs(Math.cos(o.t * 4)) * 0.8 + 0.2;  // spinning
      ctx.save(); ctx.translate(o.d, gy + o.y); ctx.scale(s, 1);
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(0, 0, 10, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(0, 0, 7.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff3b0'; ctx.fillRect(-1.5, -4, 3, 8);
      ctx.restore();
    }
    else if (o.type === 'platform') {
      const x0 = o.d - o.len / 2;
      ctx.fillRect(x0, gy - o.h, o.len, 14);
      ctx.fillStyle = sky.accent; ctx.fillRect(x0, gy - o.h, o.len, 3);
      ctx.fillStyle = 'rgba(11,10,15,0.35)'; ctx.fillRect(x0 + 8, gy - o.h + 14, o.len - 16, 6);
    }
    else if (o.type === 'bar') {
      ctx.fillRect(o.d - 26, 0, 52, by - 46);
      ctx.fillStyle = sky.accent; ctx.fillRect(o.d - 26, by - 52, 52, 6);
    }
    else if (o.type === 'star') drawStar(o, gy, sky);
    else if (o.type === 'item' && ITEMS[o.item].anim === 'club') {
      ctx.save(); ctx.shadowColor = RARITY[ITEMS[o.item].rarity]; ctx.shadowBlur = 16;
      drawMelee(o.item, o.d - 20, gy + o.y + Math.sin(o.t * 3) * 2, -0.35, 0.9);
      ctx.restore();
    }
    else if (o.type === 'item') drawShuriken(o.d, gy + o.y + Math.sin(o.t * 3) * 2, o.t * 1.5, '#ffffff', true);
    else if (o.type === 'wave') drawWave(o, gy);
    else if (o.type === 'slash') {  // where a rage slam landed: a red claw-swipe that fades fast
      const k = o.t / 0.35;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.strokeStyle = '#ff5a4a'; ctx.lineCap = 'round';
      ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 14;
      for (let i = -1; i <= 1; i++) {
        ctx.lineWidth = 7 - Math.abs(i) * 2;
        ctx.beginPath(); ctx.arc(o.d + 40 + i * 10, gy + o.y - 10 + i * 18, 70 + k * 12, 2.1, 3.6); ctx.stroke();
      }
      ctx.restore();
    }
    else if (o.type === 'grenade') {
      drawItemIcon('grenade', o.d, gy + o.y, 0.6, INK);
      if (o.bounces && Math.floor(o.t * 14) % 2) {  // armed: the light blinks after the first bounce
        ctx.fillStyle = '#ff3b3b'; ctx.beginPath(); ctx.arc(o.d, gy + o.y + 2, 3, 0, Math.PI * 2); ctx.fill();
      }
    }
    else if (o.type === 'bolt') {  // laser bolt: a short hot-pink streak with a white core
      const v = Math.hypot(o.vd, o.vy), ux = o.vd / v, uy = o.vy / v, x = o.d, y = gy + o.y;
      const L = BOLT.len * Math.min(1, o.t * 40 + 0.3);  // stretches out as it leaves the barrel
      ctx.save(); ctx.lineCap = 'round'; ctx.shadowColor = '#ff2b6a'; ctx.shadowBlur = 12;
      ctx.strokeStyle = '#ff2b6a'; ctx.lineWidth = 6; seg(x, y, x - ux * L, y - uy * L);
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; seg(x, y, x - ux * L * 0.75, y - uy * L * 0.75);
      ctx.restore();
    }
    else if (o.type === 'spark') {  // impact flash: a bright star of short rays splashing back off the surface
      const k = o.t / 0.12, x = o.d, y = gy + o.y;
      ctx.save(); ctx.globalAlpha = 1 - k; ctx.lineCap = 'round'; ctx.shadowColor = '#ff2b6a'; ctx.shadowBlur = 14;
      ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(x, y, 7 * (1 - k) + 2, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffd6e4'; ctx.lineWidth = 2;
      for (let i = 0; i < 6; i++) {
        const ra = o.a + Math.PI + (i - 2.5) * 0.45, r0 = 4 + k * 8, r1 = 12 + k * 18;
        seg(x + Math.cos(ra) * r0, y + Math.sin(ra) * r0, x + Math.cos(ra) * r1, y + Math.sin(ra) * r1);
      }
      ctx.restore();
    }
    else if (o.type === 'boom') {  // explosion: a fireball that swells and fades, with a shock ring
      const k = o.t / 0.4, x = o.d, y = gy + o.y, R = o.r * (0.45 + 0.55 * easeOut(k * 2));
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - k);
      const g = ctx.createRadialGradient(x, y, 0, x, y, R);
      g.addColorStop(0, '#fff6d0'); g.addColorStop(0.35, '#ffb347'); g.addColorStop(0.75, 'rgba(255,90,58,0.7)'); g.addColorStop(1, 'rgba(255,59,59,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, R, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x, y, o.r * easeOut(k * 1.5), 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    }
    else drawEnemy(o.d, gy + o.y, o);
  }

  // Gronk marks where his club is about to land, so you know whether to go up or down.
  if (boss && boss.zones[lane.side]) drawDangerZone(boss.zones[lane.side], gy);

  const blink = lane.body.invuln > 0 && Math.floor(time * 20) % 2 === 0;
  if (!blink) {
    ctx.shadowColor = sky.accent; ctx.shadowBlur = 14;
    const r = lane.body;
    const idle = speed === 0 && !player.moving;  // standing around in the boss arena
    const mode = r.sliding ? 'slide' : !r.grounded ? 'jump' : idle ? 'stand' : 'run';
    const swinging = swingK(r) < 1;
    const throwing = !!attackOf(r).throwSpeed && swinging;
    const firing = !!attackOf(r).beam && swinging;
    const deflect = r.deflectT > 0 ? 1 - r.deflectT / DEFLECT_T : -1;
    // whatever's selected on the hotbar is held in the front hand, so you can tell at a glance who's armed;
    // a club or axe stays put on the shoulder while running, and only leaves it for a swing
    const held = heldKey(r), free = !throwing && deflect < 0, heavyHeld = !!ITEMS[held] && ITEMS[held].anim === 'club';
    const club = attackOf(r).anim === 'club' && swinging ? clubPose(swingK(r))
               : heavyHeld && free ? { reach: CLUB_REST[0], a: CLUB_REST[1], lean: CLUB_REST[2], carry: true } : null;
    // a held gun is shouldered in both hands and follows the cursor (mirrored, like all aiming),
    // kicking back a little with each shot
    let grip = null, aimA = 0;
    if (!club && free && ITEMS[held] && ITEMS[held].beam) {
      const shX = player.off + 6, shY = gy + r.y - 58;
      aimA = Math.max(-1.25, Math.min(1.0, Math.atan2(mouse.y - shY, Math.min(mouse.x, W - mouse.x) - shX)));
      const kick = firing ? (1 - swingK(r)) * 5 : 0;
      grip = { reach: Math.PI / 2 - aimA, a: aimA, lean: 0.08, len: 15 - kick, hold: 13 };
    }
    const hand = drawStick(player.off, gy + r.y, {
      phase: player.phase, mode, deflect, club, grip, tilt: player.tilt,
      toss: throwing && deflect < 0 ? swingK(r) : -1, aim: r.aimA,
      punch: attackOf(r).anim === 'punch' && swinging && deflect < 0 ? swingK(r) : -1, alt: r.punchAlt });
    if (grip && hand) {
      const m = drawObliterator(hand[0], hand[1], aimA, 0.8, INK, firing ? 1 - swingK(r) : 0);
      r.muzzle = { dd: m[0] - player.off, dy: m[1] - (gy + r.y), a: aimA };  // where the next bolt leaves from
    } else r.muzzle = null;
    if (hand && (club || heavyHeld)) {
      // the club rests up over the shoulder; swinging, it's held in both hands (see clubPose)
      const a = club ? club.a : -2.0;
      if (club && club.smear) {  // a white smear behind the head as it comes down, centred on the shoulder
        const hx = hand[0] + Math.cos(a) * 34 - hand[2], hy = hand[1] + Math.sin(a) * 34 - hand[3];
        let end = Math.atan2(hy, hx); if (end > 1.8) end -= Math.PI * 2;  // keep it continuous through the arc
        ctx.save(); ctx.strokeStyle = '#ffffff'; ctx.globalAlpha = 0.55; ctx.lineWidth = 7; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.arc(hand[2], hand[3], Math.hypot(hx, hy), Math.max(-4.2, end - 2.2), end); ctx.stroke(); ctx.restore();
      }
      drawMelee(club && !club.carry ? r.attack : held, hand[0], hand[1], a, 0.85);
    }
    else if (hand && free && held === 'shuriken') drawShuriken(hand[0], hand[1], time * 3, sky.accent, false, 0.75);
    else if (hand && free && held && !grip) drawItemIcon(held, hand[0], hand[1], 0.5, INK);
    if (deflect >= 0) {  // the swat leaves a bright crescent in front of the runner
      const cx = player.off + 8, cy = gy + r.y - STAR.y, sweep = Math.min(1, deflect * 2.2);
      ctx.save(); ctx.shadowColor = '#ffffff'; ctx.shadowBlur = 12; ctx.lineCap = 'round';
      ctx.globalAlpha = 1 - deflect; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6 * (1 - deflect) + 2;
      ctx.beginPath(); ctx.arc(cx, cy, 40, 1.0, 1.0 - sweep * 2.7, true); ctx.stroke();
      ctx.strokeStyle = sky.accent; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(cx, cy, 50, 0.9, 0.9 - sweep * 2.5, true); ctx.stroke();
      ctx.restore();
    }
    ctx.shadowBlur = 0;
  }

  for (const p of particles) {
    if (p.side && p.side !== lane.side) continue;
    ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.color || (p.side ? sky.accent : INK);
    if (p.stick) {
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.strokeStyle = INK; ctx.lineWidth = 6; seg(-p.stick / 2, 0, p.stick / 2, 0);
      ctx.restore();
    } else ctx.fillRect(p.x, p.y, p.r, p.r);
  }
  ctx.globalAlpha = 1;

  // Impact frame: a small inverted bubble with short speed lines around the enemy only.
  // Crits get a bigger bubble, gold-and-white burst lines and an expanding double ring.
  if (impact && impact.side === lane.side && impact.deflect) {
    // parry flash: no inversion, just a hard white ring and sparks, so it reads differently from a kill
    const k = impact.t / impact.dur, R = 16 + (1 - k) * 26;
    ctx.save(); ctx.lineCap = 'round'; ctx.strokeStyle = '#fff'; ctx.shadowColor = '#fff'; ctx.shadowBlur = 16;
    ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(impact.x, impact.y, R, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 3;
    for (let i = 0; i < 8; i++) {
      const a = (i / 8) * Math.PI * 2 + 0.4;
      seg(impact.x + Math.cos(a) * (R + 4), impact.y + Math.sin(a) * (R + 4),
          impact.x + Math.cos(a) * (R + 20), impact.y + Math.sin(a) * (R + 20));
    }
    ctx.restore();
  } else if (impact && impact.side === lane.side) {
    const k = impact.t / impact.dur, crit = impact.crit;
    const R = (crit ? 58 : 46) + (1 - k) * (crit ? 44 : 30);
    if (k > (crit ? 0.3 : 0.45)) {
      ctx.save(); ctx.beginPath(); ctx.arc(impact.x, impact.y, R, 0, Math.PI * 2); ctx.clip();
      ctx.globalCompositeOperation = 'difference';
      ctx.fillStyle = '#fff'; ctx.fillRect(impact.x - R, impact.y - R, R * 2, R * 2);
      ctx.restore();
    }
    ctx.globalAlpha = k; ctx.lineCap = 'round';
    if (crit) {
      ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(impact.x, impact.y, R + 4, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(impact.x, impact.y, R * 1.35 + 10, 0, Math.PI * 2); ctx.stroke();
    }
    const n = crit ? 16 : 10;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + i * 0.5, r0 = R + 6, r1 = R + (crit ? 40 : 26) + (i % 3) * (crit ? 22 : 14);
      ctx.strokeStyle = crit && i % 2 ? '#ffd23f' : '#fff';
      ctx.lineWidth = 2 + (i % 2) * 2;
      seg(impact.x + Math.cos(a) * r0, impact.y + Math.sin(a) * r0, impact.x + Math.cos(a) * r1, impact.y + Math.sin(a) * r1);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

// Boss presentation, old-school style: letterbox bars, the name slammed onto the screen,
// a health bar that fills up before the fight, a "defeated" banner, and fades in and out of the arena.
const easeOut = k => 1 - Math.pow(1 - Math.max(0, Math.min(1, k)), 3);
function drawBossUI() {
  const b = boss;
  let fade = game.fadeIn > 0 ? game.fadeIn / 0.35 : 0;
  if (b) {
    const t = b.t;
    let bars = 0;
    if (b.state === 'intro') bars = t < 2.45 ? easeOut(t / 0.3) : 1 - easeOut((t - 2.45) / 0.25);
    if (b.state === 'dying') bars = t < 1.2 ? easeOut(t / 0.3) : t < 4.2 ? 1 : 1 - easeOut((t - 4.2) / 0.3);
    if (bars > 0) {
      ctx.fillStyle = '#000';
      ctx.fillRect(0, 0, W, 64 * bars); ctx.fillRect(0, H - 64 * bars, W, 64 * bars);
    }

    // health bar along the top, with a skull badge; it fills up during the intro
    const showBar = b.state !== 'approach' && (b.state !== 'intro' || t >= 1.6);
    if (showBar && b.state !== 'exit') {
      const bw = Math.min(560, W * 0.62), bx = W / 2 - bw / 2, by = 22 + (b.state === 'intro' || b.state === 'dying' ? 52 * bars : 0);
      const frac = b.state === 'intro' ? b.barFill : b.hp / b.maxHp;
      ctx.globalAlpha = b.state === 'dying' ? Math.max(0, 1 - t / 1.5) : 1;
      ctx.fillStyle = INK; ctx.fillRect(bx - 3, by - 3, bw + 6, 20);
      ctx.fillStyle = '#3a1016'; ctx.fillRect(bx, by, bw, 14);
      ctx.fillStyle = '#ff3b3b'; ctx.fillRect(bx, by, bw * frac, 14);
      ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(bx, by, bw * frac, 4);
      ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(bx - 4, by + 7, 17, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(bx - 4, by + 4, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(bx - 9, by + 8, 10, 6);
      ctx.fillStyle = INK; ctx.fillRect(bx - 8, by + 2, 3, 3); ctx.fillRect(bx - 3, by + 2, 3, 3);
      ctx.font = '800 13px system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#fff';
      ctx.fillText(BOSS.name, bx + 4, by + 32);
      ctx.textAlign = 'center'; ctx.globalAlpha = 1;
    }

    // the name slams down onto the screen
    if (b.state === 'intro' && t >= 1.15) {
      const k = (t - 1.15) / 0.18, s = 1 + Math.max(0, 1 - k) * 2.2;
      const out = t > 2.4 ? 1 - (t - 2.4) / 0.3 : 1;
      ctx.save(); ctx.translate(W / 2, H * 0.32); ctx.scale(s, s);
      ctx.globalAlpha = Math.max(0, Math.min(1, k * 2) * out);
      ctx.font = '900 72px system-ui, sans-serif'; ctx.lineWidth = 10; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
      ctx.strokeText(BOSS.name, 0, 0); ctx.fillStyle = '#ffffff'; ctx.fillText(BOSS.name, 0, 0);
      ctx.fillStyle = '#ff3b3b'; ctx.fillRect(-150, 16, 300 * easeOut((t - 1.33) / 0.3), 6);
      ctx.globalAlpha = Math.max(0, Math.min(1, (t - 1.45) / 0.3) * out);
      ctx.font = '800 20px system-ui, sans-serif'; ctx.fillStyle = '#ffd6d6';
      ctx.fillText(BOSS.title, 0, 50);
      ctx.restore();
    }
    // victory banner
    if (b.state === 'dying' && t >= 1.2) {
      const k = (t - 1.2) / 0.18, s = 1 + Math.max(0, 1 - k) * 2;
      ctx.save(); ctx.translate(W / 2, H * 0.3); ctx.scale(s, s);
      ctx.globalAlpha = Math.max(0, Math.min(1, k * 2) * (t > 4 ? 1 - (t - 4) / 0.5 : 1));
      ctx.font = '900 56px system-ui, sans-serif'; ctx.lineWidth = 9; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
      ctx.strokeText('BOSS DEFEATED', 0, 0); ctx.fillStyle = '#ffd23f'; ctx.fillText('BOSS DEFEATED', 0, 0);
      ctx.restore();
    }
  }
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, fade)})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- Hotbar & inventory screen ----------
// An item's icon, centered on (x, y), about 40px across at s = 1. Light by default, for the dark slots.
function drawItemIcon(key, x, y, s = 1, ink = '#f4efe6') {
  if (key === 'shuriken') return drawShuriken(x, y, 0.3, ink === INK ? '#ffffff' : INK, false, 1.3 * s, ink);
  if (key === 'obliterator') { ctx.save(); drawObliterator(x - 14 * 0.42 * s, y + 6 * 0.42 * s, 0, 0.42 * s, ink); ctx.restore(); return; }
  if (key === 'axe') { const a = -0.8; return drawAxe(x - Math.cos(a) * 17 * s, y - Math.sin(a) * 17 * s, a, 0.58 * s, ink); }
  if (key === 'club') { const a = -0.8; return drawClub(x - Math.cos(a) * 17 * s, y - Math.sin(a) * 17 * s, a, 0.62 * s, ink); }
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.strokeStyle = ctx.fillStyle = ink; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (key === 'fists') {
    ctx.beginPath(); ctx.roundRect(-11, -9, 22, 18, 5); ctx.fill();
    ctx.fillRect(-11, 5, 9, 8);  // wrist
    ctx.strokeStyle = 'rgba(11,10,15,0.6)'; ctx.lineWidth = 1.5;
    for (const kx of [-4, 1.5, 7]) seg(kx, -9, kx, -2);
  } else if (key === 'dagger') {
    ctx.rotate(-0.8);
    ctx.lineWidth = 5; seg(-19, 0, -10, 0);                       // grip
    ctx.lineWidth = 4; seg(-9, -7, -9, 7);                        // guard
    ctx.beginPath(); ctx.moveTo(-8, -4); ctx.lineTo(13, -3); ctx.lineTo(20, 0); ctx.lineTo(13, 3); ctx.lineTo(-8, 4); ctx.fill();
  } else if (key === 'pan') {
    ctx.lineWidth = 5; seg(-4, 4, -18, 18);                       // handle
    ctx.beginPath(); ctx.arc(5, -5, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(11,10,15,0.35)'; ctx.beginPath(); ctx.arc(5, -5, 9, 0, Math.PI * 2); ctx.fill();
  } else if (key === 'snack') {  // a wrapped candy
    ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(-18, -7); ctx.lineTo(-18, 7); ctx.closePath();
    ctx.moveTo(9, 0); ctx.lineTo(18, -7); ctx.lineTo(18, 7); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ff6b8a'; ctx.beginPath(); ctx.ellipse(0, 0, 11, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = ink; ctx.lineWidth = 2; seg(-3, -7, -6, 7); seg(4, -7, 1, 7);
  } else if (key === 'grenade') {
    ctx.beginPath(); ctx.arc(0, 4, 12, 0, Math.PI * 2); ctx.fill();
    ctx.fillRect(-5, -12, 10, 7);                                 // fuse cap
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(9, -12, 4.5, 0, Math.PI * 2); ctx.stroke();  // pin ring
    ctx.strokeStyle = 'rgba(11,10,15,0.4)'; seg(-11, 4, 11, 4); seg(0, -7, 0, 15);
  } else if (key === 'bandage') {
    ctx.rotate(-0.6);
    ctx.beginPath(); ctx.roundRect(-19, -7, 38, 14, 6); ctx.fill();
    ctx.fillStyle = '#e8c9a8'; ctx.fillRect(-6, -7, 12, 14);       // the pad
    ctx.fillStyle = 'rgba(11,10,15,0.35)';
    for (const [px, py] of [[-14, -3], [-14, 3], [14, -3], [14, 3]]) { ctx.beginPath(); ctx.arc(px, py, 1.2, 0, Math.PI * 2); ctx.fill(); }
  } else if (key === 'pebble') {
    ctx.beginPath(); ctx.moveTo(-14, 4); ctx.lineTo(-9, -8); ctx.lineTo(3, -12); ctx.lineTo(13, -5); ctx.lineTo(14, 6); ctx.lineTo(4, 11); ctx.lineTo(-9, 10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = RARITY.epic; ctx.beginPath(); ctx.arc(4, -4, 2.5, 0, Math.PI * 2); ctx.fill();  // a little glint
  }
  ctx.restore();
}

// One inventory slot at (x, y), s px square. `keyLabel` marks a hotbar slot (with its hotkey);
// an empty hotbar slot shows a faint fist, since that's what you attack with from it.
function drawSlot(x, y, s, stack, { selected = false, accent = '#ffffff', keyLabel = null, lifted = false, count = true, cd = null } = {}) {
  ctx.save();
  ctx.fillStyle = selected ? 'rgba(255,255,255,0.16)' : 'rgba(255,255,255,0.07)';
  ctx.beginPath(); ctx.roundRect(x, y, s, s, s * 0.16); ctx.fill();
  ctx.lineWidth = selected ? 3 : 1.5; ctx.strokeStyle = selected ? accent : 'rgba(255,255,255,0.2)'; ctx.stroke();
  if (stack && !lifted) {
    const it = ITEMS[stack.key];
    if (it.rarity !== 'common') { ctx.fillStyle = RARITY[it.rarity]; ctx.fillRect(x + s * 0.2, y + s - 5, s * 0.6, 2); }
    drawItemIcon(stack.key, x + s / 2, y + s / 2, s / 58);
    if (count && maxStack(stack.key) > 1) {
      ctx.font = `800 ${Math.round(s * 0.27)}px system-ui, sans-serif`; ctx.textAlign = 'right';
      ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.fillStyle = '#fff';
      ctx.strokeText(stack.n, x + s - 5, y + s - 6); ctx.fillText(stack.n, x + s - 5, y + s - 6);
    }
  } else if (keyLabel && !lifted) {
    ctx.globalAlpha = 0.22; drawItemIcon('fists', x + s / 2, y + s / 2, s / 58); ctx.globalAlpha = 1;
  }
  if (stack && !lifted && cd) {  // on cooldown: a dark shade that drains from the top, with the seconds left
    ctx.save(); ctx.beginPath(); ctx.roundRect(x, y, s, s, s * 0.16); ctx.clip();
    ctx.fillStyle = 'rgba(8,6,12,0.65)'; ctx.fillRect(x, y + s * (1 - cd.frac), s, s * cd.frac);
    ctx.restore();
    ctx.font = `800 ${Math.round(s * 0.3)}px system-ui, sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
    ctx.fillText(Math.ceil(cd.left), x + s / 2, y + s / 2 + s * 0.1);
  }
  if (keyLabel) {
    ctx.font = `700 ${Math.round(s * 0.22)}px system-ui, sans-serif`; ctx.textAlign = 'left';
    ctx.fillStyle = selected ? accent : 'rgba(255,255,255,0.5)'; ctx.fillText(keyLabel, x + 5, y + s * 0.26);
  }
  ctx.restore();
}

// In-game hotbars: one centered under each runner's world, along the bottom of the screen.
const HUD_SLOT = 52, HUD_GAP = 8;
function hotbarRect(side, i) {
  const w = HOTBAR * HUD_SLOT + (HOTBAR - 1) * HUD_GAP, cx = side < 0 ? W / 4 : W * 3 / 4;
  return { x: cx - w / 2 + i * (HUD_SLOT + HUD_GAP), y: H - HUD_SLOT - 18, s: HUD_SLOT };
}
const inRect = (px, py, b) => px >= b.x && px < b.x + b.s && py >= b.y && py < b.y + b.s;
function hotbarAt(px, py) {
  for (const side of [-1, 1]) for (let i = 0; i < HOTBAR; i++) if (inRect(px, py, hotbarRect(side, i))) return { side, i };
  return null;
}
// How far through its cooldown a runner's item is, for drawSlot (null when it's ready).
function cooldownOf(r, stack) {
  const left = stack && r.cds[stack.key];
  return left > 0 ? { left, frac: left / ITEMS[stack.key].cooldown } : null;
}
// A runner's health bar: red for what's left, a pale chunk for what was just lost, flashing when low.
function drawHpBar(r, x, y, w, h) {
  ctx.save();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.roundRect(x - 2, y - 2, w + 4, h + 4, 5); ctx.fill();
  ctx.fillStyle = '#3a1016'; ctx.fillRect(x, y, w, h);
  ctx.fillStyle = '#ffd6d6'; ctx.fillRect(x, y, w * r.hpLag / MAX_HP, h);
  const low = r.hp <= MAX_HP * 0.3;
  ctx.fillStyle = low && Math.floor(time * 6) % 2 ? '#ff8a8a' : r.hp > MAX_HP * 0.5 ? '#5bd16a' : low ? '#ff3b3b' : '#ffb347';
  ctx.fillRect(x, y, w * r.hp / MAX_HP, h);
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x, y, w * r.hp / MAX_HP, Math.max(2, h * 0.3));
  ctx.font = `800 ${Math.round(h * 0.85)}px system-ui, sans-serif`; ctx.textAlign = 'center';
  ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.lineJoin = 'round'; ctx.fillStyle = '#fff';
  const t = `${Math.ceil(r.hp)} / ${MAX_HP}`;
  ctx.strokeText(t, x + w / 2, y + h * 0.82); ctx.fillText(t, x + w / 2, y + h * 0.82);
  ctx.restore();
}
function drawHotbars() {
  for (const lane of lanes) {
    const r = lane.body, accent = SKIES[lane.side].accent;
    for (let i = 0; i < HOTBAR; i++) {
      const b = hotbarRect(lane.side, i);
      drawSlot(b.x, b.y, b.s, r.inv[i], { selected: i === r.slot, accent, keyLabel: hotkey(lane.side, i), cd: cooldownOf(r, r.inv[i]) });
    }
    const b0 = hotbarRect(lane.side, 0), b2 = hotbarRect(lane.side, HOTBAR - 1);
    drawHpBar(r, b0.x, b0.y - 26, b2.x + b2.s - b0.x, 16);
    // the name of what you just switched to pops up over the hotbar for a moment
    const since = time - r.switchAt;
    if (since < 1.4) {
      const b = hotbarRect(lane.side, 1), st = r.inv[r.slot], it = st ? ITEMS[st.key] : PUNCH;
      ctx.save(); ctx.globalAlpha = Math.min(1, (1.4 - since) * 3);
      ctx.font = '700 17px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
      ctx.strokeText(it.name, b.x + b.s / 2, b.y - 40); ctx.fillStyle = RARITY[it.rarity]; ctx.fillText(it.name, b.x + b.s / 2, b.y - 40);
      ctx.restore();
    }
  }
}

// The pause screen: each runner's inventory in its own half of the screen, hotbar on top, bag below.
function menuLayout() {
  // panels shrink to leave room for the shop column in the middle
  const S = Math.round(Math.max(34, Math.min(64, (W / 2 - shopWidth() - 68) / (BAG_COLS * 1.12), (H - 300) / 5.4))), G = Math.round(S * 0.16);
  const rowW = n => n * S + (n - 1) * G, top = Math.max(90, H * 0.16);
  return [-1, 1].map(side => {
    const cx = W / 2 + side * (shopWidth() / 2 + 16 + (rowW(BAG_COLS) + 44) / 2), slots = [];
    const hotY = top + 112, bagY = hotY + S + 44;
    for (let i = 0; i < HOTBAR; i++) slots.push({ side, i, x: cx - rowW(HOTBAR) / 2 + i * (S + G), y: hotY, s: S });
    for (let j = 0; j < BAG; j++)
      slots.push({ side, i: HOTBAR + j, x: cx - rowW(BAG_COLS) / 2 + (j % BAG_COLS) * (S + G), y: bagY + Math.floor(j / BAG_COLS) * (S + G), s: S });
    const pad = 22, w = rowW(BAG_COLS) + pad * 2;
    return { side, cx, top, hotY, bagY, slots, box: { x: cx - w / 2, y: top, w, h: bagY + rowW(BAG / BAG_COLS) + pad - top } };
  });
}
function menuSlotAt(px, py) {
  for (const p of menuLayout()) for (const s of p.slots) if (inRect(px, py, s)) return { side: s.side, i: s.i };
  return null;
}
// ---------- Shop ----------
// Sits between the two inventories. Gold comes out of the wallet (shared, kept between runs);
// each item has a buy button for each runner, and goes into that runner's inventory.
const SHOP = [{ key: 'grenade', price: 6 }, { key: 'bandage', price: 10 }, { key: 'obliterator', price: 1000 }];
const shopWidth = () => Math.max(200, Math.min(300, W * 0.22));
function shopLayout() {
  const w = shopWidth(), x = W / 2 - w / 2, top = Math.max(90, H * 0.16), rowH = 74, icon = 50;
  const rows = SHOP.map((e, i) => {
    const y = top + 82 + i * (rowH + 8), bx = x + 12 + icon + 10, bw = (x + w - 12 - bx - 6) / 2;
    return { ...e, x: x + 8, y, w: w - 16, h: rowH, icon: { x: x + 12, y: y + (rowH - icon) / 2, s: icon },
             buy: [-1, 1].map((side, j) => ({ side, x: bx + j * (bw + 6), y: y + 40, w: bw, h: 26 })) };
  });
  return { x, top, w, h: menuLayout()[0].box.h, rows };
}
const inBox = (px, py, b) => px >= b.x && px < b.x + b.w && py >= b.y && py < b.y + b.h;
function shopButtonAt(px, py) {
  for (const row of shopLayout().rows) for (const b of row.buy) if (inBox(px, py, b)) return { row, side: b.side };
  return null;
}
const shopRowAt = (px, py) => shopLayout().rows.find(row => inBox(px, py, row));
const shopNote = (text, color) => { menu.note = { text, color, at: performance.now() }; };
function buy(e, side) {
  const it = ITEMS[e.key], name = RUNNER_NAMES[side];
  if (wallet < e.price) return shopNote('Not enough gold', '#ff6b6b');
  if (!addItem(laneFor(side).body, e.key)) return shopNote(`${name}'s inventory is full`, '#ff6b6b');
  wallet -= e.price; saveWallet();
  shopNote(`${name} got: ${it.name}`, RARITY[it.rarity]);
}
function drawCoin(x, y, r = 10) {
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(x, y, r * 0.75, 0, Math.PI * 2); ctx.fill();
}
function drawShop() {
  const L = shopLayout(), cx = L.x + L.w / 2, hover = shopButtonAt(mouse.x, mouse.y);
  ctx.save();
  ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.strokeStyle = '#ffd23f'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.roundRect(L.x, L.top, L.w, L.h, 14); ctx.fill(); ctx.globalAlpha = 0.45; ctx.stroke(); ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.fillStyle = '#ffd23f'; ctx.font = '800 22px system-ui, sans-serif';
  ctx.fillText('SHOP', cx, L.top + 36);
  ctx.font = '700 16px system-ui, sans-serif';
  const gold = String(wallet), gw = ctx.measureText(gold).width;
  drawCoin(cx - (gw + 22) / 2 + 8, L.top + 55, 8);
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText(gold, cx - (gw + 22) / 2 + 22, L.top + 61);
  for (const row of L.rows) {
    const it = ITEMS[row.key], afford = wallet >= row.price;
    ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.beginPath(); ctx.roundRect(row.x, row.y, row.w, row.h, 10); ctx.fill();
    drawSlot(row.icon.x, row.icon.y, row.icon.s, { key: row.key, n: 1 }, { count: false });
    const tx = row.buy[0].x;
    ctx.textAlign = 'left'; ctx.font = '700 15px system-ui, sans-serif'; ctx.fillStyle = RARITY[it.rarity];
    ctx.fillText(it.name, tx, row.y + 22);
    ctx.font = '700 14px system-ui, sans-serif'; ctx.fillStyle = afford ? '#ffd23f' : '#ff6b6b';
    drawCoin(tx + 6, row.y + 30, 6);
    ctx.fillStyle = afford ? '#ffd23f' : '#ff6b6b'; ctx.fillText(row.price, tx + 16, row.y + 35);
    // one buy button per runner, in that runner's color (left button: left runner)
    for (const b of row.buy) {
      const accent = SKIES[b.side].accent, hot = hover && hover.row.key === row.key && hover.side === b.side;
      ctx.globalAlpha = afford ? 1 : 0.35;
      ctx.fillStyle = hot ? accent : 'rgba(255,255,255,0.08)'; ctx.strokeStyle = accent; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 6); ctx.fill(); ctx.stroke();
      ctx.textAlign = 'center'; ctx.font = '700 13px system-ui, sans-serif'; ctx.fillStyle = hot ? INK : accent;
      ctx.fillText(b.side < 0 ? '◀ Buy' : 'Buy ▶', b.x + b.w / 2, b.y + 17);
      ctx.globalAlpha = 1;
    }
  }

  const n = menu.note, age = n ? performance.now() - n.at : Infinity;
  if (age < 2200) {
    ctx.globalAlpha = Math.min(1, (2200 - age) / 400); ctx.textAlign = 'center';
    ctx.font = '700 14px system-ui, sans-serif'; ctx.fillStyle = n.color;
    for (const [i, l] of wrapText(n.text, L.w - 24).entries()) ctx.fillText(l, cx, L.top + L.h - 30 + i * 18);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function drawInventory() {
  ctx.save();
  ctx.fillStyle = 'rgba(8,6,12,0.8)'; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = 'center'; ctx.fillStyle = '#fff';
  ctx.font = '900 40px system-ui, sans-serif'; ctx.fillText('PAUSED', W / 2, Math.max(50, H * 0.16 - 34));
  ctx.font = '500 15px system-ui, sans-serif'; ctx.globalAlpha = 0.6;
  ctx.fillText('Esc to resume   ·   drag items to organize   ·   click a hotbar slot to hold it   ·   buy with ◀ / ▶ to pick who gets it', W / 2, Math.max(50, H * 0.16 - 34) + 26);
  ctx.globalAlpha = 1;
  const layout = menuLayout();
  for (const p of layout) {
    const r = laneFor(p.side).body, accent = SKIES[p.side].accent, b = p.box;
    ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.strokeStyle = accent; ctx.globalAlpha = 1; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 14); ctx.fill(); ctx.globalAlpha = 0.45; ctx.stroke(); ctx.globalAlpha = 1;
    ctx.textAlign = 'center'; ctx.fillStyle = accent; ctx.font = '800 22px system-ui, sans-serif';
    ctx.fillText(RUNNER_NAMES[p.side], p.cx, p.top + 36);
    const st = r.inv[r.slot], it = st ? ITEMS[st.key] : PUNCH;
    // "Holding: <item>", centered, with the item name in its rarity color
    ctx.textAlign = 'left';
    ctx.font = '500 14px system-ui, sans-serif'; const lw = ctx.measureText('Holding: ').width;
    ctx.font = '700 14px system-ui, sans-serif'; const hx = p.cx - (lw + ctx.measureText(it.name).width) / 2;
    ctx.fillStyle = RARITY[it.rarity]; ctx.fillText(it.name, hx + lw, p.top + 60);
    ctx.font = '500 14px system-ui, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fillText('Holding: ', hx, p.top + 60);
    ctx.font = '700 12px system-ui, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.45)';
    drawHpBar(r, p.slots[HOTBAR].x, p.top + 70, p.box.w - 44, 12);
    ctx.font = '700 12px system-ui, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.45)'; ctx.textAlign = 'left';
    ctx.fillText('HOTBAR', p.slots[0].x, p.hotY - 10);
    ctx.fillText('BAG', p.slots[HOTBAR].x, p.bagY - 10);
    for (const s of p.slots) {
      const lifted = menu.drag && menu.drag.side === p.side && menu.drag.i === s.i;
      drawSlot(s.x, s.y, s.s, r.inv[s.i], { selected: s.i === r.slot, accent, keyLabel: s.i < HOTBAR ? hotkey(p.side, s.i) : null, lifted, cd: cooldownOf(r, r.inv[s.i]) });
    }
  }
  drawShop();
  if (menu.drag) {  // the item being dragged follows the cursor
    const st = laneFor(menu.drag.side).body.inv[menu.drag.i];
    if (st) drawItemIcon(st.key, mouse.x, mouse.y, layout[0].slots[0].s / 52);
  } else {
    const h = menuSlotAt(mouse.x, mouse.y), st = h && laneFor(h.side).body.inv[h.i];
    if (st) drawTooltip(ITEMS[st.key], st);
    else if (h && h.i < HOTBAR) drawTooltip(PUNCH, null);
    else if (!shopButtonAt(mouse.x, mouse.y)) { const row = shopRowAt(mouse.x, mouse.y); if (row) drawTooltip(ITEMS[row.key], null, row.price); }
  }
  ctx.restore();
}

// Split text into lines no wider than maxW in the current font.
function wrapText(text, maxW) {
  const lines = []; let line = '';
  for (const w of text.split(' ')) {
    const t = line ? line + ' ' + w : w;
    if (line && ctx.measureText(t).width > maxW) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}
const cap = s => s[0].toUpperCase() + s.slice(1);
// Hover tooltip next to the cursor: name, type, stats, then the flavor text.
function drawTooltip(it, stack, price = 0) {
  const type = it.throwSpeed ? 'Thrown weapon' : it.beam ? 'Laser weapon' : it.melee ? 'Melee weapon' : it.type || 'Item';
  const rows = [[it.name, '800 18px', RARITY[it.rarity]], [`${type}  ·  ${cap(it.rarity)}`, '600 13px', 'rgba(255,255,255,0.5)']];
  if (it.min !== undefined) {
    rows.push(['', '6px'],
              [`${it.min === it.max ? it.min : it.min + '-' + it.max} damage${it.aoe ? ' (area)' : ''}`, '600 15px', '#fff'],
              [`${cap(it.attackSpeed)} attack speed (${ATTACK_SPEED[it.attackSpeed]}/s)`, '600 15px', '#fff'],
              ...(it.critChance ? [[`${Math.round(it.critChance * 100)}% crit chance  ·  x${it.critMult} crit damage`, '600 15px', '#fff']] : []));
    if (it.range) rows.push([`${it.range} reach`, '600 15px', '#fff']);
    if (it.block) rows.push([`${Math.round(it.block * 100)}% chance to block an enemy attack while held`, '600 15px', '#fff']);
    if (it.aoe) rows.push([`${it.aoe} blast radius (can hit you too)`, '600 15px', '#fff'], ['Explodes on the 2nd bounce or on contact', '600 15px', '#fff']);
    if (it.beam) rows.push(['Sprays laser bolts (they fly through platforms)', '600 15px', '#fff']);
    if (it.auto) rows.push(['Hold the mouse to keep firing', '600 15px', '#fff']);
  }
  if (it.heal) rows.push(['', '6px'], [`Restores ${it.heal} HP when used`, '600 15px', '#fff']);
  if (it.cooldown) rows.push([`${it.cooldown}s cooldown`, '600 15px', '#fff']);
  if (price) rows.push(['', '6px'], [`Price: ${price} gold`, '700 15px', wallet >= price ? '#ffd23f' : '#ff6b6b']);
  if (stack && maxStack(stack.key) > 1) rows.push([`Stack: ${stack.n} / ${maxStack(stack.key)}`, '600 13px', 'rgba(255,255,255,0.5)']);
  if (it.desc) {
    rows.push(['', '6px']);
    ctx.font = 'italic 500 14px system-ui, sans-serif';
    for (const l of wrapText(it.desc, 250)) rows.push([l, 'italic 500 14px', '#d9cfc0']);
  }
  const lh = f => parseInt(f.match(/(\d+)px/)[1]) + 6;
  let w = 0, h = 0;
  for (const [t, f] of rows) { ctx.font = f + ' system-ui, sans-serif'; w = Math.max(w, ctx.measureText(t).width); h += lh(f); }
  const pad = 12, bw = w + pad * 2, bh = h + pad * 2 - 6;
  const x = Math.min(mouse.x + 18, W - bw - 8), y = Math.max(8, Math.min(mouse.y + 18, H - bh - 8));
  ctx.save();
  ctx.fillStyle = 'rgba(14,11,20,0.96)'; ctx.strokeStyle = RARITY[it.rarity]; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.roundRect(x, y, bw, bh, 8); ctx.fill(); ctx.globalAlpha = 0.6; ctx.stroke(); ctx.globalAlpha = 1;
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  let ty = y + pad;
  for (const [t, f, c] of rows) { ctx.font = f + ' system-ui, sans-serif'; ctx.fillStyle = c || '#fff'; if (t) ctx.fillText(t, x + pad, ty); ty += lh(f); }
  ctx.restore();
}

const SKIES = {
  '-1': { top: '#2a1631', bot: '#ff8a4c', hill: 'rgba(40,18,40,0.55)', accent: '#ffb347', cave: '#5a2a35' },
  '1':  { top: '#141a3a', bot: '#5fb4ff', hill: 'rgba(15,22,55,0.55)', accent: '#7fd8ff', cave: '#22345e' },
};

function draw() {
  const shX = shake > 0.5 ? (Math.random() - 0.5) * shake : 0, shY = shake > 0.5 ? (Math.random() - 0.5) * shake : 0;
  ctx.save();
  ctx.translate(shX, shY);
  for (const side of [-1, 1]) {
    const s = SKIES[side], g = ctx.createLinearGradient(0, 0, 0, groundY());
    g.addColorStop(0, s.top); g.addColorStop(1, s.bot);
    ctx.fillStyle = g; ctx.fillRect(side < 0 ? -20 : W / 2, -20, W / 2 + 20, H + 40);
    // big setting sun behind each lane
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath(); ctx.arc(W / 2 + side * W * 0.28, groundY() - 40, Math.min(W, H) * 0.16, 0, Math.PI * 2); ctx.fill();
  }
  if (player) lanes.forEach(l => drawLane(l, SKIES[l.side]));
  ctx.restore();

  // Mirror seam
  const sg = ctx.createLinearGradient(W / 2 - 6, 0, W / 2 + 6, 0);
  sg.addColorStop(0, 'rgba(255,179,71,0.9)'); sg.addColorStop(1, 'rgba(127,216,255,0.9)');
  ctx.fillStyle = sg; ctx.fillRect(W / 2 - 2, 0, 4, H);

  // the boss stands over the seam, in front of both worlds
  if (player && boss && boss.arena && !boss.exploded) {
    ctx.save(); ctx.translate(shX, shY); drawBoss(boss, groundY()); ctx.restore();
  }

  ctx.textAlign = 'center';
  // Damage numbers are drawn in screen space so they never appear mirrored.
  if (popups) for (const p of popups) {
    const sx = p.side < 0 ? p.x : W - p.x;
    const pop = 1 + Math.max(0, 0.15 - p.age) * (p.crit ? 6 : 3);
    ctx.save(); ctx.translate(sx, p.y); ctx.scale(pop, pop);
    ctx.globalAlpha = Math.min(1, p.life * 2.5);
    ctx.font = p.crit ? '900 36px system-ui, sans-serif' : '800 24px system-ui, sans-serif';
    ctx.lineWidth = 5; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
    const label = p.crit ? p.text + '!' : String(p.text);
    ctx.strokeText(label, 0, 0);
    ctx.fillStyle = p.hurt ? '#ff5a5a' : p.heal ? '#5bd16a' : p.crit ? '#ffd23f' : '#fff'; ctx.fillText(label, 0, 0);
    ctx.restore();
  }
  ctx.fillStyle = '#fff';
  if (player && !game.paused) {  // (the inventory screen covers the HUD, so it's skipped while paused)
    ctx.font = '700 28px system-ui, sans-serif';
    if (!boss || boss.state === 'approach' || boss.state === 'exit') ctx.fillText(Math.floor(distance / 10) + ' m', W / 2, 46);
    // wallet (persists between runs; the shop will spend it later)
    ctx.font = '700 20px system-ui, sans-serif';
    const label = String(wallet), lw = ctx.measureText(label).width;
    const cx = W / 2 - (lw + 22) / 2;
    drawCoin(cx + 8, 74);
    ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText(label, cx + 22, 81); ctx.textAlign = 'center';

    // pickup labels float up over whichever runner grabbed the item, colored by rarity
    const gy = groundY(), stack = { '-1': 0, '1': 0 };
    for (const l of labels) {
      const r = lanes[l.side < 0 ? 0 : 1].body;
      const x = l.side < 0 ? player.off : W - player.off;
      const y = gy + r.y - 100 - l.rise - stack[l.side]++ * 22;
      const pop = 1 + Math.max(0, 0.12 - l.age) * 2.5;
      ctx.save(); ctx.translate(x, y); ctx.scale(pop, pop);
      ctx.globalAlpha = Math.min(1, l.life * 1.5);
      ctx.font = '700 18px system-ui, sans-serif'; ctx.lineWidth = 4; ctx.strokeStyle = INK; ctx.lineJoin = 'round';
      const text = l.count > 1 ? `${l.text} (${l.count})` : l.text;
      ctx.strokeText(text, 0, 0); ctx.fillStyle = l.color; ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    drawHotbars();
    drawBossUI();
  }
  if (player && game.paused) drawInventory();
  if (game.state !== 'play') {
    ctx.fillStyle = 'rgba(8,6,12,0.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = '800 64px system-ui, sans-serif';
    ctx.fillText(game.state === 'over' ? 'BROKEN MIRROR' : 'MIRROR RUN', W / 2, H * 0.38);
    ctx.font = '500 20px system-ui, sans-serif';
    if (game.state === 'over') {
      ctx.fillStyle = SKIES[game.fallen].accent; ctx.fillText(`The ${RUNNER_NAMES[game.fallen]} fell`, W / 2, H * 0.38 + 44); ctx.fillStyle = '#fff';
      ctx.fillText(`${Math.floor(distance / 10)} m   ·   +${player.coins} coins   ·   best ${game.best} m`, W / 2, H * 0.38 + 74);
    }
    ctx.globalAlpha = 0.85;
    ctx.fillText('W / Space  jump    S  slide / fast-fall    A / D  move    Click  attack', W / 2, H * 0.55);
    ctx.fillText('1 2 3  left hotbar    4 5 6  right hotbar    Esc  pause / inventory', W / 2, H * 0.55 + 32);
    ctx.fillText('Both runners copy your every move. Survive both worlds.', W / 2, H * 0.55 + 64);
    ctx.globalAlpha = 0.5;
    ctx.fillText('Testing:  7 enemies   8 platform   9 throwers   0 boss   - club   = +1000 gold   B brutes   X axe   P skip boss   R restart', W / 2, H * 0.55 + 96);
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(performance.now() / 300);
    ctx.fillText(game.state === 'over' ? 'Space or click to retry' : 'Space or click to start', W / 2, H * 0.55 + 140);
    ctx.globalAlpha = 1;
  }
}

let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
