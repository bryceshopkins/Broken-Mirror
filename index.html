<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mirror Run</title>
<style>
  html, body { margin: 0; height: 100%; background: #120d14; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
// ---------- Setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const INK = '#0b0a0f';
const GRAVITY = 2600, JUMP_V = 920;
const groundY = () => H * 0.72;

// ---------- Input ----------
const keys = {};
let jumpPressed = false, punchPressed = false;
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  // / (or ?) opens the debug menu; while it's open the game is frozen and only debug hotkeys work
  if (k === '/' || k === '?') { e.preventDefault(); setDebugOpen(!debug.open); return; }
  if (debug.open) {
    if (k === 'escape') setDebugOpen(false);
    else if (!e.repeat) runDebugKey(k, e.shiftKey, true);
    if (k === ' ') e.preventDefault();
    return;
  }
  // Escape freezes the run and opens the inventory; while it's open, nothing else reaches the game
  if (k === 'escape') { if (game.state === 'play' && menu.mode !== 'shop') setPaused(!game.paused); return; }
  if (!keys[k] && runDebugKey(k, e.shiftKey, false)) { keys[k] = true; return; }
  if (game.paused) {
    // in a checkpoint shop: Tab flips through the tabs, Space or Enter heads back out
    if (menu.mode === 'shop' && !e.repeat) {
      if (k === 'tab') { const i = SHOP_TABS.findIndex(t => t.id === menu.tab); setTab(SHOP_TABS[(i + (e.shiftKey ? SHOP_TABS.length - 1 : 1)) % SHOP_TABS.length].id); }
      if (k === ' ' || k === 'enter') setPaused(false);
    }
    if (k === 'tab' || k === ' ') e.preventDefault();
    keys[k] = true; return;
  }
  if ((k === 'w' || k === ' ') && !keys[k]) jumpPressed = true;
  if (k === 'e' && !keys[k]) enterOutpost();
  if ((k === ' ' || k === 'enter') && game.state !== 'play') startGame();
  if (game.state === 'play' && !keys[k]) {
    // hotbars: 1 2 3 pick the left runner's slot, 4 5 6 the right runner's
    const n = '123456'.indexOf(k);
    if (n >= 0) selectSlot(laneFor(n < HOTBAR ? -1 : 1), n % HOTBAR);
  }
  keys[k] = true;
  if (k === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
const mouse = { x: 0, y: 0, held: false };
canvas.addEventListener('mousemove', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  // in the inventory, pressing on an item and moving a few px picks it up
  const d = menu.down;
  if (d && !menu.drag && stackAt(d) && Math.hypot(mouse.x - d.x, mouse.y - d.y) > 5) menu.drag = d;
  canvas.style.cursor = game.paused ? (menu.drag ? 'grabbing' : menuRefAt(mouse.x, mouse.y) || shopButtonAt(mouse.x, mouse.y) || shopScreenButtonAt(mouse.x, mouse.y) ? 'pointer' : 'default')
                      : game.state === 'play' && hotbarAt(mouse.x, mouse.y) ? 'pointer' : '';
});
canvas.addEventListener('mousedown', e => {
  mouse.x = e.clientX; mouse.y = e.clientY;
  if (game.paused) {
    const btn = shopScreenButtonAt(mouse.x, mouse.y);  // a tab, Leave, or a checkpoint to travel to
    if (btn) { btn.run(); return; }
    const sb = shopButtonAt(mouse.x, mouse.y);
    if (sb) { buy(sb.row, sb.side); return; }
    const s = menuRefAt(mouse.x, mouse.y);
    if (s && e.shiftKey) { quickBin(s); return; }  // shift-click: straight to the trash (or sold, with the shop open)
    menu.down = s ? { ...s, x: mouse.x, y: mouse.y } : null;
    return;
  }
  if (game.state !== 'play') { startGame(); return; }
  // clicking a hotbar slot switches to it instead of attacking
  const hb = hotbarAt(mouse.x, mouse.y);
  if (hb) selectSlot(laneFor(hb.side), hb.i); else punchPressed = mouse.held = true;
});
window.addEventListener('mouseup', () => {
  mouse.held = false;
  const { down, drag } = menu;
  menu.down = menu.drag = null;
  if (!game.paused || !down) return;
  if (drag) {
    const to = menuRefAt(mouse.x, mouse.y);
    if (!to) return;
    if (isBin(drag.i) || isBin(to.i)) return dropBin(drag, to);
    // between slots: only within the same runner's inventory
    if (to.side === drag.side && !moveStack(laneFor(drag.side).body, drag.i, to.i)) wrongSlotNote(laneFor(drag.side).body, drag.i, to.i);
  } else if (isBin(down.i)) return;
  else if (down.i < HOTBAR) selectSlot(laneFor(down.side), down.i);  // a plain click on a hotbar slot holds it
  else quickEquip(laneFor(down.side).body, down.i);  // and on gear, wears it (or takes it off)
});
function setPaused(on) {
  game.paused = on; menu.down = menu.drag = null; mouse.held = false;
  menu.trash = menu.sold = null;  // closing the inventory makes the trash and the last sale final
  if (!on && menu.mode === 'shop' && outpost) { outpost.state = 'exit'; outpost.t = 0; }  // leaving a checkpoint shop
  if (!on) { menu.mode = 'pause'; setTab('shop'); }
  jumpPressed = punchPressed = false;
  canvas.style.cursor = on ? 'default' : '';
}

// ---------- Debug menu ----------
// Every testing shortcut lives in DEBUG_KEYS, so the hotkey and the button in the / menu do the same thing.
// `any`: works outside a run and in the inventory too. `stay`: clicking it keeps the menu open.
const debug = { open: false, god: false, timeScale: 1, bossLow: false };
const TIME_STEPS = [0.1, 0.25, 0.5, 0.75, 1, 1.5, 2, 3, 4];
const giveBoth = key => lanes.forEach(l => { if (!l.body.inv.some(s => s && s.key === key) && addItem(l.body, key)) addLabel(l, key); });
const debugNote = text => popups.push({ x: W / 2, y: 150, vx: 0, vy: -40, text, word: true, side: -1, life: 1.4, age: 0 });
function setTimeScale(v) { debug.timeScale = v; refreshDebugMenu(); }
function stepTimeScale(dir) {
  const i = TIME_STEPS.findIndex(v => v >= debug.timeScale - 1e-6);
  setTimeScale(TIME_STEPS[Math.max(0, Math.min(TIME_STEPS.length - 1, (i < 0 ? TIME_STEPS.length - 1 : i) + dir))]);
}
function skipBoss() {  // straight to the post-Gronk run (brutes start showing up)
  if (game.bossDefeated) return;
  if (boss) { boss = null; lanes.forEach(l => { l.obs = l.obs.filter(o => o.type === 'coin' || o.type === 'item' || o.type === 'health'); }); }
  game.bossDefeated = true; nextBeat = 300; nextPlatform = 800;
  game.nextBiome = Math.max(game.nextBiome, distance + BIOME.gap[0] / 2);
  debugNote('GRONK SKIPPED');
}
const DEBUG_KEYS = [
  { key: 'g', label: 'Invulnerable (god mode)', any: true, stay: true, toggle: () => debug.god,
    run: () => { debug.god = !debug.god; if (player) debugNote(debug.god ? 'GOD MODE ON' : 'GOD MODE OFF'); } },
  { key: '[', label: 'Slow down time', any: true, stay: true, run: () => stepTimeScale(-1) },
  { key: ']', label: 'Speed up time', any: true, stay: true, run: () => stepTimeScale(1) },
  { key: '\\', label: 'Normal speed', any: true, stay: true, run: () => setTimeScale(1) },
  { key: '7', label: 'Spawn enemies', run: () => lanes.forEach(l => spawnObstacle(l, 'enemy')) },
  { key: '8', label: 'Spawn platform', run: () => spawnObstacle(lanes[Math.random() < 0.5 ? 0 : 1], 'platform') },
  { key: '9', label: 'Spawn throwers', run: () => lanes.forEach(l => spawnObstacle(l, 'thrower')) },
  { key: 'b', label: 'Spawn brutes', run: () => lanes.forEach(l => spawnObstacle(l, 'brute')) },
  // O: a deep pond with a piranha just ahead of both runners (Shift+O: an ankle-deep puddle)
  { key: 'o', label: 'Deep pond + piranha', run: () => lanes.forEach(l => spawnPond(l, player.off + 240, 62, true, true)) },
  { key: 'o', shift: true, label: 'Shallow puddle', run: () => lanes.forEach(l => spawnPond(l, player.off + 240, 9, false, true)) },
  { key: '-', label: 'Give club', stay: true, run: () => giveBoth('club') },
  { key: 'x', label: 'Give battle axe', stay: true, run: () => giveBoth('axe') },
  { key: '=', label: '+1000 gold', any: true, stay: true, run: () => { wallet += 1000; saveWallet(); } },
  { key: '0', label: 'Start Gronk (boss)', run: () => { if (!boss && !game.bossDefeated) startBoss(); } },
  { key: 'p', label: 'Skip Gronk (post-boss run)', run: skipBoss },
  { key: 'r', label: 'Restart run', any: true, run: () => startGame() },
  // T / C: a tunnel or cave starts sloping in just ahead (N: the one you're in starts sloping back out)
  { key: 't', label: 'Tunnel now', run: () => debugBiome('tunnel') },
  { key: 'c', label: 'Cave now', run: () => debugBiome('cave') },
  { key: 'n', label: 'Back to open sky', run: () => {
    const b = game.biome;
    if (b) b.end = Math.min(b.end, Math.max(b.start + 2 * BIOME.ramp, distance + W / 2 + BIOME.ramp));
  } },
  { key: 'h', label: 'Spawn helmeted enemies', run: () => lanes.forEach(l => { const o = spawnObstacle(l, 'enemy'); if (o) o.gear = ['rustedHelmet']; }) },
  { key: 'j', label: 'Give Rusted Helmet', stay: true, run: () => giveBoth('rustedHelmet') },
  { key: 'k', label: 'Spawn knife enemies', run: () => lanes.forEach(l => spawnObstacle(l, 'knifer')) },
  { key: 'l', label: 'Give Knife', stay: true, run: () => giveBoth('knife') },
  { key: 'u', label: 'Checkpoint shop now', run: () => { if (!outpost && !boss) startOutpost(Math.round(game.nextCheckpoint / CHECKPOINT.every)); } },
];
function debugBiome(kind) {
  if (boss) return debugNote('NOT DURING GRONK');
  startBiome(kind, true);
  debugNote(kind.toUpperCase() + ' AHEAD');
}
// Menu-only extras: jump to a point in the run, or tweak the runners.
const DEBUG_SKIPS = [
  { label: 'Fresh run', run: () => startGame() },
  { label: 'Right before Gronk can show up', run: () => { if (!boss) game.bossDefeated = false; time = Math.max(time, BOSS.after - 3); game.bossCheck = 0; } },
  { label: 'Gronk fight now', run: () => { if (!boss && !game.bossDefeated) startBoss(); } },
  { label: 'Gronk fight, nearly dead', run: () => { if (!boss) { game.bossDefeated = false; startBoss(); } debug.bossLow = true; } },
  { label: 'After Gronk (brutes)', run: skipBoss },
  { label: 'Late run (+1000 m, top speed)', run: () => { distance += 10000; nextBeat = Math.min(nextBeat, 300); } },
  { label: 'Full heal', stay: true, run: () => lanes.forEach(l => { l.body.hp = l.body.hpLag = MAX_HP; }) },
  { label: 'Give The Obliterator', stay: true, run: () => giveBoth('obliterator') },
];
// Runs a hotkey's action; returns true if the key was a debug key.
function runDebugKey(k, shift, fromMenu) {
  const a = DEBUG_KEYS.find(d => d.key === k && !!d.shift === (k === 'o' && shift)) || DEBUG_KEYS.find(d => d.key === k && !d.shift);
  if (!a) return false;
  if (!a.any && (game.state !== 'play' || game.paused) && !fromMenu) return false;
  doDebug(a);
  return true;
}
function doDebug(a) {
  if (!a.any || a.label === 'Restart run') {
    if (game.state !== 'play' && a.label !== 'Fresh run' && a.label !== 'Restart run') startGame();
    if (game.paused) setPaused(false);
  }
  a.run();
  if (!a.stay && debug.open) setDebugOpen(false);
  refreshDebugMenu();
}

// The menu itself is plain HTML over the canvas, so it's easy to click.
const dbgCss = document.createElement('style');
dbgCss.textContent = `
  #dbg { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8,6,12,0.55); font: 14px system-ui, sans-serif; color: #fff; z-index: 5; }
  #dbg.open { display: flex; }
  #dbg .panel { background: #1c1520; border: 2px solid #3a2a40; border-radius: 12px; padding: 18px 20px; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 32px); overflow: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5); box-sizing: border-box; }
  #dbg h2 { margin: 0 0 4px; font-size: 20px; letter-spacing: 0.06em; }
  #dbg .sub { opacity: 0.6; margin-bottom: 14px; }
  #dbg h3 { margin: 16px 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; color: #ffb347; }
  #dbg .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; }
  #dbg button { display: flex; align-items: center; gap: 10px; text-align: left; background: #2a2030; color: #fff; border: 1px solid #44334c; border-radius: 8px; padding: 8px 10px; font: inherit; cursor: pointer; }
  #dbg button:hover { background: #3a2c42; border-color: #7fd8ff; }
  #dbg button.on { background: #1f4a2c; border-color: #5bd16a; }
  #dbg kbd { min-width: 26px; text-align: center; background: #0b0a0f; border: 1px solid #555; border-radius: 5px; padding: 2px 6px; font: 600 12px ui-monospace, monospace; color: #7fd8ff; }
  #dbg .time { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #dbg .time button { padding: 6px 10px; }
  #dbg .time .val { font: 700 18px system-ui, sans-serif; min-width: 64px; }
`;
document.head.appendChild(dbgCss);
const dbgEl = document.createElement('div');
dbgEl.id = 'dbg';
document.body.appendChild(dbgEl);
const keyName = d => (d.shift ? 'Shift+' : '') + (d.key === '\\' ? '\\' : d.key.toUpperCase());
function buildDebugMenu() {
  const btn = (d, i, list) => `<button data-list="${list}" data-i="${i}"${d.toggle && d.toggle() ? ' class="on"' : ''}>${d.key ? `<kbd>${keyName(d)}</kbd>` : ''}<span>${d.label}${d.toggle ? (d.toggle() ? ': ON' : ': off') : ''}</span></button>`;
  const keyed = (from, to) => DEBUG_KEYS.map((d, i) => [d, i]).slice(from, to).map(([d, i]) => btn(d, i, 'k')).join('');
  dbgEl.innerHTML = `<div class="panel">
    <h2>DEBUG MENU</h2><div class="sub">Game is frozen while this is open. <kbd>/</kbd> or <kbd>Esc</kbd> to close. Every hotkey also works during a run.</div>
    <h3>Cheats</h3><div class="grid">${keyed(0, 1)}${btn(DEBUG_SKIPS[6], 6, 's')}${btn(DEBUG_SKIPS[7], 7, 's')}${keyed(12, 13)}</div>
    <h3>Time</h3><div class="time">${keyed(1, 2)}<span class="val">${debug.timeScale}x</span>${keyed(2, 3)}
      ${TIME_STEPS.map(v => `<button data-time="${v}"${v === debug.timeScale ? ' class="on"' : ''}>${v}x</button>`).join('')}${keyed(3, 4)}</div>
    <h3>Skip to</h3><div class="grid">${DEBUG_SKIPS.slice(0, 6).map((d, i) => btn(d, i, 's')).join('')}</div>
    <h3>Spawn and give</h3><div class="grid">${keyed(4, 12)}${keyed(19, 23)}</div>
    <h3>Biomes</h3><div class="grid">${keyed(16, 19)}</div>
    <h3>Run</h3><div class="grid">${keyed(13, 16)}</div>
  </div>`;
}
dbgEl.addEventListener('mousedown', e => e.stopPropagation());
dbgEl.addEventListener('click', e => {
  if (e.target === dbgEl) return setDebugOpen(false);  // click outside the panel closes it
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.time) return setTimeScale(Number(b.dataset.time));
  doDebug((b.dataset.list === 'k' ? DEBUG_KEYS : DEBUG_SKIPS)[b.dataset.i]);
});
function refreshDebugMenu() { if (debug.open) buildDebugMenu(); }
function setDebugOpen(on) {
  debug.open = on; dbgEl.classList.toggle('open', on);
  for (const k in keys) keys[k] = false;  // don't leave a runner stuck holding a key
  jumpPressed = punchPressed = mouse.held = false;
  if (on) buildDebugMenu();
}

// ---------- Game state ----------
// Both characters share ONE body state; only the worlds they run through differ.
const game = { state: 'title', best: 0, paused: false };
// inventory screen: the slot pressed on, the one being dragged, whether the shop is open, and what's
// sitting in the trash / sell slot ({ side, stack }, plus `paid` for a sale) until something replaces it
// `mode` is 'pause' (Esc: just the inventories) or 'shop' (a checkpoint shop, with its tabs).
const menu = { down: null, drag: null, mode: 'pause', tab: 'shop', shopOpen: false, trash: null, sold: null };
let player, lanes, particles, popups, labels, impact, shake, distance, speed, nextBeat, nextPlatform, time;

// Tuning — kept slow for now while players learn the mirrored controls.
const BASE_SPEED = 200, MAX_SPEED = 420, SPEED_RAMP = 200;  // ramp: px travelled per +1 px/s
const ENEMY_HP = 12;

// Weapon stats. Every attack, fists included, has:
//   attackSpeed  a tier from ATTACK_SPEED: how many attacks per second that runner can make
//   min / max    damage per hit (rolled between the two)
//   critChance   0-1 chance a hit is a crit; critMult multiplies a crit's damage
//   range        how far in front of the runner a melee hit reaches (px)
//   swing        how long the attack animation lasts (s), and when in it the hit is live
//                (as fractions of that time)
const ATTACK_SPEED = { extreme: 16, fast: 5, medium: 3.3, slow: 1.4 };  // attacks per second
const ATTACK_BUFFER = 0.2;  // s a click is remembered while the weapon is still recovering
const PUNCH = { name: 'Fists', rarity: 'common', melee: true, anim: 'punch', attackSpeed: 'medium', min: 12, max: 16,
                critChance: 0.2, critMult: 2, range: 80, swing: { dur: 0.24, hit: [0.12, 0.88] },
                desc: 'Placeholder tooltip. (Used whenever the selected hotbar slot is empty.)' };

// Items. They belong to whichever runner picks them up, so the two sides can end up differently
// armed. Rarity sets the color of the item's name. `desc` is the tooltip flavor text in the inventory.
//   melee       swung when it's the selected hotbar item (`anim` picks the animation)
//   throwSpeed  thrown, one per attack, used up from the stack (`lob`: falls and bounces, like the grenade)
//   beam        sprays piercing laser bolts at the cursor; `auto` keeps firing while the mouse is held
//   aoe         explodes, hitting everything within this radius (you too, if you're close)
//   block       chance it turns aside an enemy attack while it's the item in hand
//   heal        HP restored when used from the hotbar (`cooldown`: seconds before that runner can use another)
//   stack       how many fit in one slot (default 1)
//   type        what the tooltip calls items that aren't weapons
//   equip       gear: the equipment slot it's worn in ('head', 'chest', 'feet' or 'accessory')
//   stats       what wearing it adds; every equipped piece's stats are summed (see gearStat)
//   worn        how it's drawn on a body that wears it (a WORN entry), so runners and enemies show it
//   value       base sell price in gold for one of it, before the rarity multiplier (see sellValue).
//               Shop items skip this and sell back for SELL.shopCut of their shop price instead.
const RARITY = { common: '#ffffff', uncommon: '#5bd16a', rare: '#4da6ff', epic: '#c77dff', legendary: '#ff9f1c' };
const ITEMS = {
  shuriken: { name: 'Shuriken', rarity: 'common', value: 0.2, stack: 99, attackSpeed: 'fast', min: 12, max: 16, critChance: 0.2, critMult: 2,
              throwSpeed: 650, swing: { dur: 0.18, hit: [0, 0] },
              desc: 'Every 6th grader\'s wet dream, these stars were forged by hand by a master weapon smith (they were made in China and ordered on Amazon). These are consumable items.' },
  club: { name: 'Spiked Club', rarity: 'rare', value: 4, melee: true, anim: 'club', attackSpeed: 'slow', min: 24, max: 32, critChance: 0.2, critMult: 2,
          range: 110, swing: { dur: 0.7, hit: [0.36, 1] },  // live from the downswing on, so spam-clicking covers you
          desc: 'Hey batter batter batter- the perfect tool for any major league baseball player, as long as that major league baseball player has a fetish for turning people into pancakes.' },
  axe: { name: 'Battle Axe', rarity: 'rare', value: 3, melee: true, anim: 'club', attackSpeed: 'slow', min: 25, max: 25, critChance: 0.2, critMult: 2,
         range: 85, block: 0.1, swing: { dur: 0.7, hit: [0.36, 1] },
         desc: 'One swing from this can split you in two... again... I guess.' },
  // shop items
  grenade: { name: 'Grenade', rarity: 'uncommon', stack: 20, attackSpeed: 'slow', min: 50, max: 50, critChance: 0, critMult: 1,
             throwSpeed: 560, lob: true, aoe: 110, swing: { dur: 0.3, hit: [0, 0] },
             desc: 'This little bundle of joy has the ability to completely obliterate anybody that is unfortunate enough to be on the receiving end of the explosion, including the thrower themselves if they get too close. And you wonder why women live longer than men.' },
  bandage: { name: 'Bandage', rarity: 'common', type: 'Consumable', stack: 10, heal: 15, cooldown: 15,
             desc: 'Gives 15 healthpoints. 15 second cooldown. Increased effectiveness when paired with a kiss to your boo boo, but we don\'t sell those.' },
  obliterator: { name: 'The Obliterator', rarity: 'legendary', beam: true, auto: true, attackSpeed: 'extreme', min: 200, max: 200,
                 critChance: 0.1, critMult: 2, swing: { dur: 0.07, hit: [0, 0] },
                 desc: 'Don\'t bring a knife to a fucking space age superhuman weapon fight. Said to be fueled by pure hatred, this weapon could make even Americans reconsider the 2nd amendment.' },
  knife: { name: 'Knife', rarity: 'uncommon', value: 1.5, melee: true, anim: 'punch', attackSpeed: 'fast', min: 13, max: 17,
           critChance: 0.3, critMult: 2, range: 85, swing: { dur: 0.16, hit: [0.1, 0.9] },
           desc: 'It\'s a knife. Stab something. Go on.' },
  // armor
  rustedHelmet: { name: 'Rusted Helmet', rarity: 'common', value: 1.5, type: 'Helmet', equip: 'head', stats: { defense: 3 }, worn: 'rustedHelmet',
                  desc: 'Have you ever used 1-ply toilet paper and thought, \'wow, this is really easy to break\' yeah, well that\'s this item, but in armor form. How stylish.' },
  // Placeholders, so the inventory has something in it. Weapons swing with the punch animation for now.
  dagger: { name: 'Rusty Dagger', rarity: 'common', value: 1, melee: true, anim: 'punch', attackSpeed: 'fast', min: 8, max: 11,
            critChance: 0.35, critMult: 2, range: 75, swing: { dur: 0.16, hit: [0.1, 0.9] }, desc: 'Placeholder tooltip.' },
  pan: { name: 'Frying Pan', rarity: 'uncommon', value: 2, melee: true, anim: 'punch', attackSpeed: 'medium', min: 17, max: 22,
         critChance: 0.15, critMult: 2.5, range: 95, swing: { dur: 0.26, hit: [0.15, 0.85] }, desc: 'Placeholder tooltip.' },
  snack: { name: 'Mystery Snack', rarity: 'common', value: 0.1, type: 'Consumable', stack: 20, desc: 'Placeholder tooltip. (Can\'t be used yet.)' },
  pebble: { name: 'Suspicious Pebble', rarity: 'epic', value: 2, type: 'Trinket', desc: 'Placeholder tooltip.' },

  const u = d - (p.d - p.len / 2), b = Math.min(POND.bank, p.len * 0.3);
  const k = Math.max(0, Math.min(1, u / b, (p.len - u) / b));

const underRoof = (lane, d) => { const h = tunnelAt(lane, d); return h && h.u > h.t.gap && h.u < roofEnd(h.t); };

// The surface a walking enemy at height y should stand on at d: raised ground, the tunnel roof

function surfaceAt(lane, d, y, hopsHoles = false) {
  const lift = ledgeLift(lane, d);
  if (lift) return -lift;
  const hit = tunnelAt(lane, d);
  if (hit && y <= 0 && (hopsHoles || hit.u > hit.t.gap)) {
    // walking enemies up top hop across the hole instead of tumbling into it
    if (hit.u <= hit.t.gap) return -Math.sin(Math.PI * hit.u / hit.t.gap) * 45;
    return 0;  // on the roof

// Terrain never stacks, and never slides in under a floating platform (that's what used to
// leave platform guards hanging in the sky).
const terrainOverlaps = (lane, a, b) =>
  lane.obs.some(o => (o.type === 'ledge' || o.type === 'tunnel' || o.type === 'platform' || o.type === 'pond') &&
                     o.d + o.len / 2 > a && o.d - o.len / 2 < b);

// `extra` pushes the obstacle further out; `y` lifts it (negative = up). Unless `placed`,
// it's automatically raised onto any ledge underneath it, and skipped if it would float over a hole.
// Overhead walls and enemies don't share space: an enemy would stand inside the wall.
const nearBar = (lane, d, r) => lane.obs.some(o => o.type === 'bar' && Math.abs(o.d - d) < r);
const nearEnemy = (lane, d, r) => lane.obs.some(o => o.type === 'enemy' && !o.dead && Math.abs(o.d - d) < r);

function spawnObstacle(lane, type, extra = 0, y = 0, placed = false) {
  const d = W / 2 + 60 + extra;
  if (type === 'pond') return spawnPond(lane, d);
  // nothing stands in the water but plain walkers wading through (coins can hang over it)
  if (!placed && type !== 'coin' && type !== 'enemy' && pondAt(lane, d)) return null;
  if (type === 'enemy' && (placed || !pondAt(lane, d)) && Math.random() < NINJA_CHANCE) type = 'thrower';  // not in the water
  let kind = null;
  if (type === 'enemy' && Math.random() < KNIFER.chance) type = 'knifer';  // (a walker that didn't turn ninja)
  if (type === 'thrower' || type === 'brute' || type === 'knifer') { kind = type; type = 'enemy'; }
  const isTerrain = type === 'ledge' || type === 'tunnel';
  let len = 0;
  if (isTerrain) {
    len = type === 'ledge' ? LEDGE.minLen + Math.random() * (LEDGE.maxLen - LEDGE.minLen)
                           : TUNNEL.minLen + Math.random() * (TUNNEL.maxLen - TUNNEL.minLen);
    if (terrainOverlaps(lane, d - 40, d + len + 40) || biomeOver(d - 40, d + len + 40)) return null;  // never stack terrain, or put it in a tunnel or cave
  } else if (!placed && type !== 'platform' && tunnelAt(lane, d) && !underRoof(lane, d)) {
    return null;  // would float over a hole
